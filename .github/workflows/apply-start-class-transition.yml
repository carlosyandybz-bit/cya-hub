name: Apply start class transition patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/start-class-transition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch class start transition
        run: python scripts/patch-start-class-transition.py
      - name: Regression test
        run: node --test tests/start-class-transition.test.mjs
      - name: Build Next.js application
        run: npm run build
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- app/cya-app.tsx; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cya-app.tsx
          git commit -m "P21 corrective: make class start transition reliable"
          git push origin HEAD:${{ github.head_ref }}
