name: Validate visual integrity v23

on:
  push:
    branches:
      - fix/visual-integrity-v23
    paths:
      - .github/workflows/validate-visual-integrity-v23.yml

permissions:
  contents: write

jobs:
  audit-fix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/visual-integrity-v23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply visual audit corrections
        run: python scripts/apply_visual_integrity_v23.py
      - name: Remove temporary helper files
        run: rm -f scripts/apply_visual_integrity_v23.py .github/workflows/validate-visual-integrity-v23.yml
      - name: Install dependencies
        run: npm ci
      - name: Visual integrity regression tests
        run: node --test tests/visual-integrity.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing rendered HTML tests
        run: node --test tests/rendered-html.test.mjs
      - name: Commit validated visual audit
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Correct global mobile visual integrity [validated-v23]"
          git push origin HEAD:fix/visual-integrity-v23
