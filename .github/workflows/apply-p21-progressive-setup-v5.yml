name: Apply P21 progressive setup v5

on:
  push:
    branches:
      - p21/dar-clase-definitivo
    paths:
      - '.github/workflows/apply-p21-progressive-setup-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p21/dar-clase-definitivo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correct helper regression scopes
        shell: python
        run: |
          from pathlib import Path
          path=Path('tools/p21_apply_progressive_setup.py')
          text=path.read_text()

          old_sub="app,count=pattern.subn(replacement,app,count=1)"
          new_sub="app,count=pattern.subn(lambda _match: replacement,app,count=1)"
          if text.count(old_sub) == 1:
              text=text.replace(old_sub,new_sub,1)
          elif text.count(new_sub) != 1:
              raise SystemExit('progressive subn marker is not in an expected state')

          setup_line="  const setup = sliceBetween(app, 'function ClassSetupStage(', 'function ClassPreparationStage(');\\n"
          if text.count(setup_line) != 1:
              raise SystemExit(f'setup slice line expected once, got {text.count(setup_line)}')
          text=text.replace(setup_line,'',1)
          if text.count('assert.match(setup,') != 6:
              raise SystemExit(f'setup assertions expected 6, got {text.count("assert.match(setup,")}')
          text=text.replace('assert.match(setup,','assert.match(app,')

          draft_line="  const draft = sliceBetween(app, 'function ManualClassDraft(', 'function ClassSetupStage(');\\n"
          if text.count(draft_line) != 1:
              raise SystemExit(f'draft slice line expected once, got {text.count(draft_line)}')
          text=text.replace(draft_line,'',1)
          if text.count('assert.match(draft,') != 1 or text.count('assert.doesNotMatch(draft,') != 1:
              raise SystemExit('draft assertions are not in the expected state')
          text=text.replace('assert.match(draft,','assert.match(app,',1)
          text=text.replace('assert.doesNotMatch(draft,','assert.doesNotMatch(app,',1)

          path.write_text(text)
      - name: Apply progressive setup
        run: python tools/p21_apply_progressive_setup.py
      - name: Regressions
        run: node --test tests/p21-dar-clase.test.mjs tests/start-class-transition.test.mjs tests/class-summary-content-editor.test.mjs tests/p19-persona-unica.test.mjs tests/p17-evaluation-cutover.test.mjs
      - name: Lint
        run: npx eslint app/cya-app.tsx app/class-summary-content-editor.tsx app/person-identity-editor.tsx
      - name: Build
        run: npm run build
      - name: Persist P21.3
        run: |
          git config user.name 'cya-hub-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/cya-app.tsx tests/p21-dar-clase.test.mjs docs/P21_DAR_CLASE_RECONCILIACION.md tools/p21_apply_progressive_setup.py
          git commit -m 'P21.3: make class setup progressive'
          git push origin HEAD:p21/dar-clase-definitivo
