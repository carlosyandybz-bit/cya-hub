name: Validate Point 10 class workflow
on:
  push:
    branches: [feat/point10-class-workflow]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Point 10 patch
        run: python scripts/apply-point10.py
      - name: Install dependencies
        run: npm ci
      - name: Point 10 and regression tests
        run: node --test tests/class-workflow-point10.test.mjs tests/live-session-dedup.test.mjs tests/point8-final-close-v30.test.mjs tests/no-real-time-class-duration.test.mjs tests/numeric-inputs.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing rendered regression
        run: npm test
      - name: Diff integrity
        run: git diff --check
      - name: Commit validated functional files
        if: success()
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/globals.css supabase/v31-class-workflow-realtime.sql tests/class-workflow-point10.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Implement Point 10 class workflow [validated-v31]"
            git push origin HEAD:feat/point10-class-workflow
          fi
