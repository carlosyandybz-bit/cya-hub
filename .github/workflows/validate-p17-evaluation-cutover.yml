name: Validate P17 evaluation cutover

on:
  pull_request:
    paths:
      - "app/evaluation-**"
      - "app/context-evaluation-panel*"
      - "app/cya-app.tsx"
      - "app/student-detail.tsx"
      - "app/page.tsx"
      - "app/layout.tsx"
      - "supabase/v43-evaluation-final-cutover.sql"
      - "supabase/v53_p0e_optional_evaluation_baseline.sql"
      - "tests/p17-evaluation-cutover.test.mjs"
      - "tests/p0e-optional-evaluation.test.mjs"
      - ".github/workflows/validate-p17-evaluation-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: P17/P0E regression tests
        run: node --test tests/p17-evaluation-cutover.test.mjs tests/p0e-optional-evaluation.test.mjs
      - name: Lint evaluation surfaces
        run: npx eslint app/context-evaluation-panel.tsx app/evaluation-post-class.tsx app/page.tsx app/cya-app.tsx app/student-detail.tsx
      - name: Build Next.js application
        run: npm run build
