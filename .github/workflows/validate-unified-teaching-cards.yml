name: Validate unified teaching cards

on:
  push:
    branches:
      - feature/unified-teaching-cards
    paths:
      - .github/workflows/validate-unified-teaching-cards.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-teaching-cards
          fetch-depth: 0
      - name: Apply unified teaching-card integration
        run: python scripts/patch-unified-teaching-cards.py
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Regression tests
        run: node --test tests/rendered-html.test.mjs
      - name: Commit validated integration
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/cya-app.tsx app/student-detail.tsx
          git commit -m "Integrate unified teaching cards"
          git push origin HEAD:feature/unified-teaching-cards
