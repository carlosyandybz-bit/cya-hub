name: Validate Point 3B numeric inputs
on:
  push:
    branches: [feat/point3b-numeric-inputs]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply numeric input patch
        run: |
          sed -i 's/if before != 12:/if before != 14:/' scripts/apply-point3b-numeric-inputs.py
          python scripts/apply-point3b-numeric-inputs.py
      - name: Install dependencies
        run: npm ci
      - name: Point 3B regressions
        run: node --test tests/numeric-inputs.test.mjs tests/point8-final-close-v30.test.mjs tests/no-real-time-class-duration.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing rendered regression
        run: node --test tests/rendered-html.test.mjs
      - name: Diff integrity
        run: |
          git diff --check
          if grep -RIn 'type="number"' app --include='*.tsx'; then
            echo 'type=number remains in application TSX' >&2
            exit 1
          fi
          git diff --exit-code -- app/globals.css app/student-detail.module.css
      - name: Commit validated functional files
        run: |
          git config user.name 'carlosyandybz-bit'
          git config user.email 'carlosyandybz@gmail.com'
          git add app/cya-app.tsx app/admin-view.tsx app/marketing-view-legacy.tsx tests/numeric-inputs.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize numeric inputs across CYA Hub [validated-point3b]'
            git push origin HEAD:feat/point3b-numeric-inputs
          fi
