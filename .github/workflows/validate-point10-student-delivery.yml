name: Validate Point 10 student delivery
on:
  push:
    branches: [feat/point10-student-delivery-fix]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply student delivery fix
        run: python scripts/fix-point10-student-delivery.py
      - name: Install dependencies
        run: npm ci
      - name: Point 10 delivery and regression tests
        run: node --test tests/point10-student-delivery.test.mjs tests/class-workflow-point10.test.mjs tests/live-session-dedup.test.mjs tests/point8-final-close-v30.test.mjs tests/no-real-time-class-duration.test.mjs tests/numeric-inputs.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing rendered regression
        run: npm test
      - name: Diff integrity
        run: git diff --check
      - name: Commit validated functional files
        if: success()
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx supabase/v31-class-workflow-realtime.sql tests/point10-student-delivery.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Close Point 10 student visibility gaps [validated-v31]"
            git push origin HEAD:feat/point10-student-delivery-fix
          fi
