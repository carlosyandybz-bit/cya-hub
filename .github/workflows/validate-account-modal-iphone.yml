name: Validate iPhone account modal fix

on:
  push:
    branches:
      - fix/account-modal-iphone
    paths:
      - .github/workflows/validate-account-modal-iphone.yml

permissions:
  contents: write

jobs:
  fix-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/account-modal-iphone
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply viewport-safe modal correction
        run: python scripts/fix_account_modal_iphone.py
      - name: Remove temporary helpers
        run: rm -f scripts/fix_account_modal_iphone.py .github/workflows/validate-account-modal-iphone.yml
      - name: Install dependencies
        run: npm ci
      - name: Account menu tests
        run: node --test tests/account-menu.test.mjs
      - name: Visual integrity tests
        run: node --test tests/visual-integrity.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing rendered HTML tests
        run: node --test tests/rendered-html.test.mjs
      - name: Commit validated fix
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep account dialogs inside iPhone viewport [validated-v24b]"
          git push origin HEAD:fix/account-modal-iphone
