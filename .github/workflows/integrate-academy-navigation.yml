name: Integrate Academia navigation

on:
  push:
    branches: [feat/postrelease-academia-online]
    paths:
      - 'scripts/integrate-academy-navigation.py'
      - '.github/workflows/integrate-academy-navigation.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-academia-online
      - name: Apply verified patch
        run: python scripts/integrate-academy-navigation.py
      - name: Verify integration anchors
        run: |
          grep -q 'AcademyOnlineTeacherView' app/cya-app.tsx
          grep -q 'AcademyOnlineStudentComingSoon' app/cya-app.tsx
          grep -q 'DesktopPrimaryNavigation' app/cya-app.tsx
          grep -q 'StatisticsView' app/cya-app.tsx
          grep -q 'go("academy")' app/home-view.tsx
          grep -q 'AcademyOnlineAdmin' app/admin-view.tsx
      - name: Commit application integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/cya-app.tsx app/home-view.tsx app/admin-view.tsx
          git commit -m 'Integrate Academia navigation and surfaces'
          git push origin HEAD:feat/postrelease-academia-online
