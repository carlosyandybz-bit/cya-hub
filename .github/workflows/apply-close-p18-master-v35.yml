name: Apply P18 closure to master plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close:
    if: github.head_ref == 'docs/close-p18-master-v35'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Close P18 in master plan
        run: python scripts/close-p18-master-v35.py
      - name: Validate closure markers
        run: |
          grep -F 'Versión: **3.5**' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          grep -F 'Última actualización secuencial cerrada: **P18 / v46**' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          grep -F '## P18 — Identidad, roles, navegación y “Ver como” ✅ CERRADO' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          grep -F '## P19 — Alumnado + persona única + identidades 🟣 SIGUIENTE' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
      - name: Commit master plan if needed
        run: |
          if git diff --quiet -- docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          git commit -m 'docs: close P18 and advance master plan to P19'
          git push origin HEAD:${{ github.head_ref }}
