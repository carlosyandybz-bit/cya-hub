name: P29 Marketing CRM

on:
  push:
    branches: [feat/p29-marketing-crm]
    paths:
      - 'app/marketing-view.tsx'
      - 'app/marketing-view-legacy.tsx'
      - 'app/marketing-p29.css'
      - 'app/layout.tsx'
      - 'db/migrations/v68_p29_marketing_crm_closure.sql'
      - 'tests/p29-marketing.test.mjs'
      - '.github/workflows/p29-marketing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: P29 Marketing contracts
        run: node --test tests/p29-marketing.test.mjs
      - name: Preserve P19-P28 contracts
        run: >-
          node --test
          tests/p19-persona-unica.test.mjs
          tests/p20-form-engine.test.mjs
          tests/p21-dar-clase.test.mjs
          tests/p22-student-portal.test.mjs
          tests/p23-teaching-contract.test.mjs
          tests/p24-contextual-home.test.mjs
          tests/p25-missions.test.mjs
          tests/p26-calendar-sync.test.mjs
          tests/p27-notification-engine.test.mjs
          tests/p27-notification-reactivation.test.mjs
          tests/p28-data-transfer.test.mjs
          tests/documentation-consistency.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Whitespace
        run: git diff --check
