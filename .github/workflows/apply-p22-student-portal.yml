name: Apply P22 student portal UX

on:
  push:
    branches:
      - p22/portal-alumno-definitivo
    paths:
      - 'scripts/patch-p22-student-portal.mjs'
      - '.github/workflows/apply-p22-student-portal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[p22-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p22/portal-alumno-definitivo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply P22 portal codemod
        run: node scripts/patch-p22-student-portal.mjs
      - name: Verify patch
        run: git diff --check && git diff --exit-code --quiet -- scripts/patch-p22-student-portal.mjs || true
      - name: Commit patched application
        run: |
          if git diff --quiet -- app/cya-app.tsx app/account-pages.tsx; then
            echo "No application changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cya-app.tsx app/account-pages.tsx
          git commit -m "P22: refine student portal UX [p22-codemod]"
          git push origin HEAD:p22/portal-alumno-definitivo
