name: Apply P26 UI patch
on:
  push:
    branches: [feat/p26-agenda-google-calendar]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p26-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p26-agenda-google-calendar
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-p26-ui.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: git diff --check
      - name: Commit exact patch and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-p26-ui.mjs .github/workflows/apply-p26-ui.yml
          git add app/agenda-view.tsx app/admin-view.tsx app/v14-types.ts app/google-calendar-sync-server.ts .env.example db/migrations/v63_p26_google_calendar_sync.sql
          git commit -m "[p26-ui-applied] Wire Google Calendar into Agenda and Administration"
          git push origin HEAD:feat/p26-agenda-google-calendar
