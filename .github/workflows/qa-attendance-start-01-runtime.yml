name: QA ATTENDANCE-START-01 Runtime

on:
  pull_request:
    branches: [class/attendance-start-01]
    paths:
      - '.github/workflows/qa-attendance-start-01-runtime.yml'
      - 'qa/attendance-start-01/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-supabase-runtime:
    name: Ephemeral Supabase runtime + concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA workstream head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Guard exact product candidate and QA-only scope
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA='9e2ba6cc5726c498fda1275a5190736f7ea44653'
          CANDIDATE_BLOB='4f0d454ec0d8e2cf7697debc1eee95ab0920cb40'
          MIGRATION='supabase/migrations/20260822200930_attendance_start_01.sql'

          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" HEAD
          test "$(git hash-object "$MIGRATION")" = "$CANDIDATE_BLOB"
          git diff --exit-code "$CANDIDATE_SHA" -- "$MIGRATION" docs/attendance-start-01.md docs/CORE_01_MIGRATION_PROVENANCE.json tests/attendance-start-01.test.mjs .github/workflows/attendance-start-01-proof.yml

          bad="$(git diff --name-only "$CANDIDATE_SHA"..HEAD | grep -Ev '^(qa/attendance-start-01/|\.github/workflows/qa-attendance-start-01-runtime\.yml$)' || true)"
          if [ -n "$bad" ]; then
            echo 'QA workstream changed non-QA files:' >&2
            echo "$bad" >&2
            exit 1
          fi

          echo "Exact candidate preserved: ${CANDIDATE_SHA} / ${CANDIDATE_BLOB}"

      - name: Start disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cya-attendance-qa
          mkdir -p /tmp/cya-attendance-qa
          cd /tmp/cya-attendance-qa
          supabase init
          supabase start
          supabase status -o env > /tmp/cya-attendance-qa.env

      - name: Reproduce exact PRE-APPLY dependency slice locally
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /tmp/cya-attendance-qa.env
          set +a
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/foundation.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/classes-and-credits.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/qa/attendance-start-01/preapply-runtime-slice.sql"

          old_sig="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.start_manual_class(text,bigint[],timestamp with time zone,integer,bigint,bigint,text)') is not null")"
          new_sig="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "select to_regprocedure('public.start_manual_class(text,bigint[],timestamp with time zone,integer,bigint,uuid,bigint,text)') is not null")"
          test "$old_sig" = 't'
          test "$new_sig" = 'f'
          echo 'Disposable database is at required PRE-APPLY signature state.'

      - name: Apply exact candidate only to disposable database
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /tmp/cya-attendance-qa.env
          set +a
          test "$(git hash-object supabase/migrations/20260822200930_attendance_start_01.sql)" = '4f0d454ec0d8e2cf7697debc1eee95ab0920cb40'
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20260822200930_attendance_start_01.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema';"
          sleep 2

      - name: Run independent runtime and concurrency matrix
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /tmp/cya-attendance-qa.env
          set +a
          # QA-harness-only normalization: psql command tags (e.g. INSERT 0 1) are not query values.
          # Execute a deterministic temporary copy with -q added to the scalar-query helper.
          cp qa/attendance-start-01/runtime.mjs /tmp/attendance-start-01-runtime.mjs
          sed -i "s/\[DB_URL, '-X', '-A', '-t'/[DB_URL, '-X', '-q', '-A', '-t'/" /tmp/attendance-start-01-runtime.mjs
          grep -F "[DB_URL, '-X', '-q', '-A', '-t'" /tmp/attendance-start-01-runtime.mjs >/dev/null
          node /tmp/attendance-start-01-runtime.mjs | tee /tmp/attendance-start-01-runtime.log

      - name: Upload QA runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-start-01-runtime-${{ github.run_id }}
          path: /tmp/attendance-start-01-runtime.log
          if-no-files-found: warn
          retention-days: 30

      - name: Destroy disposable Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -d /tmp/cya-attendance-qa ]; then
            cd /tmp/cya-attendance-qa
            supabase stop --no-backup || supabase stop || true
          fi
