name: Validate CYA Hub staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qlngfkzmncihtdzktcmd.supabase.co
    steps:
      - name: Refuse non-staging branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "staging" ]]; then
            echo "Canonical build validation is restricted to staging." >&2
            exit 1
          fi
          if [[ "${NEXT_PUBLIC_SUPABASE_URL}" != "https://qlngfkzmncihtdzktcmd.supabase.co" ]]; then
            echo "Canonical staging validation must target CYA Hub Staging Supabase." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Lint recently hardened surfaces
        run: npx eslint app/evaluation-initial-class.tsx app/evaluation-post-class.tsx app/evaluation-settings/evaluation-settings-client.tsx app/evaluation-history/evaluation-history-client.tsx app/evaluation-history/page.tsx app/progress-summary/progress-summary-client.tsx app/progress-summary/page.tsx app/page.tsx app/layout.tsx
      - name: Record legacy lint debt
        continue-on-error: true
        run: npm run lint
      - name: Build Next.js application
        run: npm run build
