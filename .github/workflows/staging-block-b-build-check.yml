name: Staging Block B build check

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-block-b-build-check.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and capture diagnostics
        id: build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p .qa
          set +e
          npm run build > .qa/block-b-build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            printf 'PASS\n' > .qa/block-b-build-status.txt
          else
            printf 'FAIL\n' > .qa/block-b-build-status.txt
          fi
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name 'CYA Staging QA'
          git config user.email 'actions@users.noreply.github.com'
          git add .qa/block-b-build.log .qa/block-b-build-status.txt
          git commit -m 'test(staging): Block B build diagnostic' || exit 0
          git push origin HEAD:staging
      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
