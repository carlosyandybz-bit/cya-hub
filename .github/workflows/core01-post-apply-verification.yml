name: CORE-01 Post-Apply Verification
run-name: CORE-01 post-apply verification

on:
  push:
    tags:
      - "core01-staging-verify-run-*-pr-*-sha-*"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  verify-staging-application:
    name: Call same-commit trusted verifier
    uses: ./.github/workflows/core01-post-apply-trusted.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
