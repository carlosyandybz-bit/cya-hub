name: Validate Point 8 final close v30

on:
  push:
    branches:
      - feat/point8-final-close-v30

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v30 UI patch
        run: python scripts/apply-v30-point8.py
      - name: Install dependencies
        run: npm ci
      - name: Targeted Point 8 regressions
        run: node --test tests/point8-final-close-v30.test.mjs tests/class-close-partial-video.test.mjs tests/class-close-extras.test.mjs tests/compatible-credit-selection.test.mjs tests/no-real-time-class-duration.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing rendered regression
        run: node --test tests/rendered-html.test.mjs
      - name: Diff integrity
        run: git diff --check
      - name: Commit validated functional files
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/globals.css
          if git diff --cached --quiet; then
            echo "No generated UI changes to commit"
          else
            git commit -m "Finalize Point 8 class close UX [validated-v30]"
            git push origin HEAD:feat/point8-final-close-v30
          fi
