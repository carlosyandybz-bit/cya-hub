name: Apply Feedback lint fixes

on:
  push:
    branches:
      - feat/postrelease-feedback-online
    paths:
      - .github/workflows/diagnose-feedback-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-feedback-online
          fetch-depth: 0
      - name: Apply exact fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              return text.replace(old, new, 1)

          admin = Path("app/feedback-online-admin.tsx")
          text = admin.read_text()
          text = one(
              text,
              '  useEffect(() => { void load(); }, [load]);\n',
              '  useEffect(() => {\n    const timer = window.setTimeout(() => { void load(); }, 0);\n    return () => window.clearTimeout(timer);\n  }, [load]);\n',
              "admin initial load",
          )
          admin.write_text(text)

          student = Path("app/feedback-online-student.tsx")
          text = student.read_text()
          text = one(
              text,
              '  useEffect(() => { void load(); }, [load]);\n',
              '  useEffect(() => {\n    const timer = window.setTimeout(() => { void load(); }, 0);\n    return () => window.clearTimeout(timer);\n  }, [load]);\n',
              "student initial load",
          )
          student.write_text(text)

          staff = Path("app/feedback-online-staff.tsx")
          text = staff.read_text()
          text = one(
              text,
              'import { useCallback, useEffect, useMemo, useState } from "react";\n',
              'import { useCallback, useEffect, useState } from "react";\n',
              "staff imports",
          )
          text = one(
              text,
              '    if (!selectedId || !nextRequests.some((row) => row.id === selectedId)) setSelectedId(nextRequests[0]?.id ?? null);\n',
              '    if (!selectedId || !nextRequests.some((row) => row.id === selectedId)) {\n      const nextSelected = nextRequests[0] ?? null;\n      setSelectedId(nextSelected?.id ?? null);\n      setSummary(nextSelected?.teacher_summary || "");\n    }\n',
              "staff selected load",
          )
          text = one(
              text,
              '  useEffect(() => { if (!visible) return; void load(); }, [load, visible]);\n\n  const selected = requests.find((row) => row.id === selectedId) ?? requests[0] ?? null;\n  useEffect(() => { setSummary(selected?.teacher_summary || ""); }, [selected?.id, selected?.teacher_summary]);\n',
              '  useEffect(() => {\n    if (!visible) return;\n    const timer = window.setTimeout(() => { void load(); }, 0);\n    return () => window.clearTimeout(timer);\n  }, [load, visible]);\n\n  const selected = requests.find((row) => row.id === selectedId) ?? requests[0] ?? null;\n',
              "staff effects",
          )
          old = '''  const requestLinks = selected ? links.filter((row) => row.request_id === selected.id) : [];
  const linkedContentIds = new Set(requestLinks.map((row) => row.content_id));
  const contextReady = Boolean(selected?.style_term_id && selected?.role_term_id && selected?.level_term_id);
  const compatible = useMemo(() => {
    if (!selected || !contextReady) return [];
    const q = search.trim().toLocaleLowerCase("es");
    return library.filter((content) =>
      !linkedContentIds.has(content.id)
      && content.teaching_content_styles.some((row) => row.style_term_id === selected.style_term_id)
      && content.teaching_content_roles.some((row) => row.role_term_id === selected.role_term_id)
      && content.teaching_content_levels.some((row) => row.level_term_id === selected.level_term_id)
      && (!q || content.title.toLocaleLowerCase("es").includes(q))
    ).slice(0, 20);
  }, [contextReady, library, linkedContentIds, search, selected]);
'''
          new = '''  const requestLinks = selected ? links.filter((row) => row.request_id === selected.id) : [];
  const linkedContentIds = new Set(requestLinks.map((row) => row.content_id));
  const contextReady = Boolean(selected?.style_term_id && selected?.role_term_id && selected?.level_term_id);
  const query = search.trim().toLocaleLowerCase("es");
  const compatible = !selected || !contextReady ? [] : library.filter((content) =>
    !linkedContentIds.has(content.id)
    && content.teaching_content_styles.some((row) => row.style_term_id === selected.style_term_id)
    && content.teaching_content_roles.some((row) => row.role_term_id === selected.role_term_id)
    && content.teaching_content_levels.some((row) => row.level_term_id === selected.level_term_id)
    && (!query || content.title.toLocaleLowerCase("es").includes(query))
  ).slice(0, 20);
'''
          text = one(text, old, new, "staff compatible content")
          text = one(
              text,
              'onClick={() => setSelectedId(row.id)}',
              'onClick={() => { setSelectedId(row.id); setSummary(row.teacher_summary || ""); }}',
              "staff queue selection",
          )
          staff.write_text(text)

          drive = Path("app/google-drive-server.ts")
          text = drive.read_text()
          text = one(
              text,
              'type FeedbackUploadContext = { request_id: number; person_id: number };\ntype FeedbackMediaContext = FeedbackUploadContext & { upload_proof: string };\n',
              'type FeedbackUploadContext = { request_id: number; person_id: number; external_file_id: string | null };\ntype FeedbackMediaContext = { request_id: number; person_id: number; upload_proof: string };\n',
              "drive feedback context types",
          )
          drive.write_text(text)

          upload = Path("app/api/feedback-online/upload/route.ts")
          text = upload.read_text()
          text = one(
              text,
              '    const previousFileId = typeof (context as { external_file_id?: unknown }).external_file_id === "string"\n      ? String((context as { external_file_id: string }).external_file_id).trim()\n      : "";\n',
              '    const previousFileId = context.external_file_id?.trim() || "";\n',
              "upload previous file type",
          )
          upload.write_text(text)
          PY
      - name: Verify fixes
        run: |
          grep -q 'window.setTimeout(() => { void load(); }, 0)' app/feedback-online-admin.tsx
          grep -q 'window.setTimeout(() => { void load(); }, 0)' app/feedback-online-student.tsx
          ! grep -q 'useMemo' app/feedback-online-staff.tsx
          grep -q 'external_file_id: string | null' app/google-drive-server.ts
      - name: Remove diagnostics and commit
        run: |
          rm -f .github/workflows/diagnose-feedback-lint.yml lint-feedback-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/feedback-online-admin.tsx app/feedback-online-student.tsx app/feedback-online-staff.tsx app/google-drive-server.ts app/api/feedback-online/upload/route.ts .github/workflows/diagnose-feedback-lint.yml lint-feedback-diagnostic.txt
          git commit -m "Fix Feedback Online React lint contracts"
          git push origin HEAD:feat/postrelease-feedback-online
