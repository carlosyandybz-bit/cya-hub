name: P24 Contextual Home
on:
  push:
    branches: [feat/p24-contextual-home]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: P24 contract tests
        run: node --test tests/p24-contextual-home.test.mjs
      - name: Preserve P17 P18 P19 contracts
        run: node --test tests/p17-evaluation-cutover.test.mjs tests/p0e-optional-evaluation.test.mjs tests/p0f-milestone-admin-contract.test.mjs tests/p18-identity-navigation.test.mjs tests/p19-persona-unica.test.mjs
      - run: npm run lint
      - run: npm run build
