name: Apply approved P0A navigation fix

on:
  push:
    branches:
      - audit/release-wide-20260812
    paths:
      - .github/workflows/p0a-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/release-wide-20260812
          fetch-depth: 0
      - name: Apply semantic class-mode navigation fix and regression assertions
        shell: python
        run: |
          from pathlib import Path

          app = Path("app/cya-app.tsx")
          text = app.read_text()
          anchor = '  const styles = catalog.filter((term) => term.taxonomy === "dance_style");\n  function goLive(id?: number) { navigateView("live", { liveClassId: id ?? liveClassId }); }'
          replacement = '  const styles = catalog.filter((term) => term.taxonomy === "dance_style");\n  const isLiveClassSessionActive = view === "live" && liveClassId !== null && classes.some((item) => item.id === liveClassId && item.status === "active" && item.workflow_stage === "live");\n  function goLive(id?: number) { navigateView("live", { liveClassId: id ?? liveClassId }); }'
          if anchor not in text:
              raise SystemExit("P0A app anchor not found")
          text = text.replace(anchor, replacement, 1)
          nav_old = '{view !== "live" ? <nav className="mobile-nav">'
          nav_new = '{!isLiveClassSessionActive ? <nav className="mobile-nav">'
          if nav_old not in text:
              raise SystemExit("P0A mobile nav condition not found")
          text = text.replace(nav_old, nav_new, 1)
          app.write_text(text)

          test = Path("qa/tests/functional-class-flow.spec.ts")
          t = test.read_text()
          center_anchor = '    await expect(page.getByRole("heading", { name: "Centro de clases" })).toBeVisible();\n\n    const classRow = page.locator(".scheduled-section .class-center-row")'
          center_replacement = '    await expect(page.getByRole("heading", { name: "Centro de clases" })).toBeVisible();\n    if ((page.viewportSize()?.width ?? 9999) <= 720) {\n      await expect(page.locator(".mobile-nav")).toBeVisible();\n      for (const label of ["Inicio", "Alumnado", "Dar clase", "Enseñanza", "Marketing"]) {\n        await expect(page.locator(".mobile-nav").getByRole("button", { name: new RegExp(`^${label}$`) })).toBeVisible();\n      }\n    }\n\n    const classRow = page.locator(".scheduled-section .class-center-row")'
          if center_anchor not in t:
              raise SystemExit("P0A center test anchor not found")
          t = t.replace(center_anchor, center_replacement, 1)

          prep_anchor = '    const startClassButton = page.getByRole("main").getByRole("button", { name: "Dar clase", exact: true });\n    await expect(startClassButton).toBeVisible();\n    await startClassButton.click();'
          prep_replacement = '    const startClassButton = page.getByRole("main").getByRole("button", { name: "Dar clase", exact: true });\n    await expect(startClassButton).toBeVisible();\n    if ((page.viewportSize()?.width ?? 9999) <= 720) await expect(page.locator(".mobile-nav")).toBeVisible();\n    await startClassButton.click();'
          if prep_anchor not in t:
              raise SystemExit("P0A prep test anchor not found")
          t = t.replace(prep_anchor, prep_replacement, 1)

          live_anchor = '    await expect(page.getByText("DANDO CLASE", { exact: true })).toBeVisible({ timeout: 20_000 });\n    await completeInitialEvaluationIfPresent(page);'
          live_replacement = '    await expect(page.getByText("DANDO CLASE", { exact: true })).toBeVisible({ timeout: 20_000 });\n    if ((page.viewportSize()?.width ?? 9999) <= 720) await expect(page.locator(".mobile-nav")).toBeHidden();\n    await completeInitialEvaluationIfPresent(page);'
          if live_anchor not in t:
              raise SystemExit("P0A live test anchor not found")
          t = t.replace(live_anchor, live_replacement, 1)

          closed_anchor = '    await expect(page.getByRole("heading", { name: "Centro de clases" })).toBeVisible({ timeout: 20_000 });\n    await attachCheckpoint(page, testInfo, `${testInfo.project.name}-teacher-class-closed`);'
          closed_replacement = '    await expect(page.getByRole("heading", { name: "Centro de clases" })).toBeVisible({ timeout: 20_000 });\n    if ((page.viewportSize()?.width ?? 9999) <= 720) await expect(page.locator(".mobile-nav")).toBeVisible();\n    await attachCheckpoint(page, testInfo, `${testInfo.project.name}-teacher-class-closed`);'
          if closed_anchor not in t:
              raise SystemExit("P0A closed test anchor not found")
          t = t.replace(closed_anchor, closed_replacement, 1)
          test.write_text(t)

          Path(".github/workflows/p0a-apply.yml").unlink()
      - name: Commit approved P0A
        run: |
          git config user.name "CYA Hub QA"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx qa/tests/functional-class-flow.spec.ts .github/workflows/p0a-apply.yml
          git commit -m "fix: separate class center from active class chrome"
          git push origin HEAD:audit/release-wide-20260812
