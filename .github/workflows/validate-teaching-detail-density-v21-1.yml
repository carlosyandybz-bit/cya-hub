name: Validate teaching detail density v21.1
on:
  push:
    branches: [fix/teaching-detail-density-v21-1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
