name: Validate class close partial payment and video v29

on:
  push:
    branches:
      - feat/class-close-partial-payment-video-v29

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v29 UI patch
        run: python scripts/apply-v29-ui.py
      - name: Install dependencies
        run: npm ci
      - name: Targeted regressions
        run: node --test tests/class-close-partial-video.test.mjs tests/class-close-extras.test.mjs tests/compatible-credit-selection.test.mjs tests/no-real-time-class-duration.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing test suite
        run: npm test
      - name: Commit validated code
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/teaching-media-editor.tsx app/teaching-media-editor.module.css app/google-drive-server.ts app/api/google-drive/upload/route.ts app/globals.css tests/class-close-extras.test.mjs tests/compatible-credit-selection.test.mjs tests/no-real-time-class-duration.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Add partial payments and class explanatory videos [validated-v29]"
            git push origin HEAD:feat/class-close-partial-payment-video-v29
          fi
