name: Apply Feedback lint fixes

on:
  push:
    branches:
      - feat/postrelease-feedback-online
    paths:
      - scripts/apply-feedback-lint-fixes.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-feedback-online
          fetch-depth: 0
      - name: Apply fixes
        run: python scripts/apply-feedback-lint-fixes.py
      - name: Verify
        run: |
          grep -q 'window.setTimeout(() => { void load(); }, 0)' app/feedback-online-admin.tsx
          grep -q 'window.setTimeout(() => { void load(); }, 0)' app/feedback-online-student.tsx
          grep -q 'const compatible = !selected || !contextReady ? \[\]' app/feedback-online-staff.tsx
          grep -q 'external_file_id: string | null' app/google-drive-server.ts
      - name: Commit and clean diagnostics
        run: |
          rm -f scripts/apply-feedback-lint-fixes.py
          rm -f .github/workflows/apply-feedback-lint-fixes.yml
          rm -f .github/workflows/diagnose-feedback-lint.yml
          rm -f lint-feedback-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Feedback Online lint issues"
          git push origin HEAD:feat/postrelease-feedback-online
