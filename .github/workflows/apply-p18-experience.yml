name: Apply P18 experience flow

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'p18/identity-roles-navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch P18 UI
        run: python scripts/patch-p18-experience.py
      - name: P18 regression tests
        run: node --test tests/p18-identity-navigation.test.mjs
      - name: Lint account menu
        run: npx eslint app/account-menu.tsx
      - name: Build Next.js application
        run: npm run build
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- app/cya-app.tsx app/account-menu.tsx; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cya-app.tsx app/account-menu.tsx
          git commit -m "P18: enforce Ver como through server-authorized context"
          git push origin HEAD:${{ github.head_ref }}
