name: Apply BZ transversal integration

on:
  push:
    branches: [feat/postrelease-bz-points]
    paths:
      - 'scripts/apply-bz-transversal-ui.mjs'
      - '.github/workflows/apply-bz-transversal-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-bz-points
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/apply-bz-transversal-ui.mjs
      - run: git diff --check
      - name: Commit changes and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-bz-transversal-ui.mjs .github/workflows/apply-bz-transversal-ui.yml
          git add app/admin-data-transfer.tsx app/statistics-engine.ts
          git commit -m "Integrate BZ Points with data transfer and statistics"
          git push origin HEAD:feat/postrelease-bz-points
