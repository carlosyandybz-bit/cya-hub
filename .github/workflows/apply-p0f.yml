name: Apply P0F source patch

on:
  push:
    branches:
      - feat/p0f-live-class-milestones
    paths:
      - 'scripts/apply-p0f.mjs'
      - '.github/workflows/apply-p0f.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[p0f-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0f-live-class-milestones
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize one-shot patcher safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply-p0f.mjs')
          text=path.read_text()
          text=text.replace('postReplacement+postEnd', 'postReplacement')
          text=text.replace('createNew+updateStart', 'createNew')
          text=text.replace('livePrefix+searchSection', 'livePrefix')
          text=text.replace("app.slice(lClose+'/ >'.length)", "app.slice(lClose+'/>; })'.length)")
          path.write_text(text)
          PY
      - run: node scripts/apply-p0f.mjs
      - run: git diff --check
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit P0F source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "p0f: implement live class and hito evaluation [p0f-applied]"
          git push origin HEAD:feat/p0f-live-class-milestones
