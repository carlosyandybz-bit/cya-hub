name: Apply P0F source patch

on:
  push:
    branches:
      - feat/p0f-live-class-milestones
    paths:
      - 'scripts/apply-p0f.mjs'
      - '.github/workflows/apply-p0f.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[p0f-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p0f-live-class-milestones
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize one-shot patcher safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply-p0f.mjs')
          text=path.read_text()
          text=text.replace('postReplacement+postEnd', 'postReplacement')
          text=text.replace('createNew+updateStart', 'createNew')
          text=text.replace('livePrefix+searchSection', 'livePrefix')
          text=text.replace("app.slice(lClose+'/ >'.length)", "app.slice(lClose+'/>; })'.length)")
          path.write_text(text)
          admin=Path('app/p0f-evaluation-admin.tsx')
          admin_text=admin.read_text()
          admin_text=admin_text.replace('setContentId((value)=>value??Number(contentResult.data?.[0]?.id||0)||null);', 'setContentId((value)=>value ?? (Number(contentResult.data?.[0]?.id||0) || null));')
          old='''  useEffect(()=>{\n    setStyleId((value)=>value??styles[0]?.id??null);setRoleId((value)=>value??roles[0]?.id??null);\n    setLevelId((value)=>value??levels[0]?.id??null);setAptitudeId((value)=>value??aptitudes[0]?.id??null);\n  },[aptitudes,levels,roles,styles]);'''
          new='''  useEffect(()=>{\n    const timer=window.setTimeout(()=>{\n      setStyleId((value)=>value??styles[0]?.id??null);setRoleId((value)=>value??roles[0]?.id??null);\n      setLevelId((value)=>value??levels[0]?.id??null);setAptitudeId((value)=>value??aptitudes[0]?.id??null);\n    },0);\n    return()=>window.clearTimeout(timer);\n  },[aptitudes,levels,roles,styles]);'''
          if old not in admin_text:
            raise SystemExit('P0F admin selector effect marker missing')
          admin_text=admin_text.replace(old,new)
          admin.write_text(admin_text)
          PY
      - run: node scripts/apply-p0f.mjs
      - run: git diff --check
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit P0F source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "p0f: implement live class and hito evaluation [p0f-applied]"
          git push origin HEAD:feat/p0f-live-class-milestones
