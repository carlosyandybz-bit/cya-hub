name: Validate no real-time class duration v26

on:
  push:
    branches:
      - fix/no-real-time-class-duration-v26

permissions:
  contents: write

jobs:
  validate-no-real-time-duration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-real-time-class-duration-v26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply no-real-time duration patch
        run: node scripts/fix-no-real-time-class-duration-v26.mjs
      - name: Remove integration helper
        run: rm scripts/fix-no-real-time-class-duration-v26.mjs
      - name: Install dependencies
        run: npm ci
      - name: No-real-time duration regression checks
        run: node --test tests/no-real-time-class-duration.test.mjs
      - name: Visual integrity checks
        run: node --test tests/visual-integrity.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing tests
        run: npm test
      - name: Commit validated change
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/cya-app.tsx supabase/v26-no-real-time-class-duration.sql tests/no-real-time-class-duration.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Stop measuring real class duration [validated-v26]"
            git push origin HEAD:fix/no-real-time-class-duration-v26
          fi
