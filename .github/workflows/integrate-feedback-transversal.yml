name: Integrate Feedback transversal

on:
  push:
    branches:
      - feat/postrelease-feedback-online
    paths:
      - .github/workflows/integrate-feedback-transversal.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/postrelease-feedback-online
          fetch-depth: 0
      - name: Patch exact anchors
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {n}")
              return text.replace(old,new,1)

          catalog=Path('app/statistics-catalog.ts')
          text=catalog.read_text()
          text=one(text,
            'export type StatisticBlock = "classes" | "students" | "business" | "teaching" | "bz" | "marketing" | "operations";',
            'export type StatisticBlock = "classes" | "students" | "business" | "teaching" | "bz" | "feedback" | "marketing" | "operations";',
            'statistics block type')
          text=one(text,
            '  bz: "BZ Points",\n  marketing: "Marketing",',
            '  bz: "BZ Points",\n  feedback: "Feedback Online",\n  marketing: "Marketing",',
            'statistics block label')
          anchor='  { key:"bz_redemptions", block:"bz", label:"Recompensas canjeadas", format:"number", filters:["student"], description:"Cupones o descuentos creados mediante canje durante el periodo." },\n\n'
          addition=anchor+'''  { key:"feedback_submitted", block:"feedback", label:"Feedback enviados", format:"number", filters:["student","style"], description:"Solicitudes de Feedback Online enviadas durante el periodo." },
  { key:"feedback_completed", block:"feedback", label:"Feedback completados", format:"number", filters:["student","style"], description:"Revisiones de Feedback Online terminadas durante el periodo." },
  { key:"feedback_pending", block:"feedback", label:"Feedback pendientes", format:"number", filters:["student","style"], description:"Solicitudes que seguían pendientes o en revisión al cierre del periodo." },
  { key:"feedback_response_hours", block:"feedback", label:"Tiempo medio de respuesta", format:"number", filters:["student","style"], description:"Horas medias entre el envío del vídeo y la finalización del Feedback." },
  { key:"feedback_credits_purchased", block:"feedback", label:"Créditos de Feedback comprados", format:"number", filters:["student"], description:"Créditos añadidos por compras confirmadas; excluye ajustes manuales." },
  { key:"feedback_credits_consumed", block:"feedback", label:"Créditos de Feedback consumidos", format:"number", filters:["student"], description:"Créditos consumidos al enviar solicitudes; excluye ajustes y reembolsos." },

'''
          text=one(text,anchor,addition,'statistics feedback catalog')
          catalog.write_text(text)

          engine=Path('app/statistics-engine.ts')
          text=engine.read_text()
          anchor='  throw new Error("Métrica BZ no soportada.");\n}\n\nexport async function calculateStatistic'
          helper='''  throw new Error("Métrica BZ no soportada.");
}

async function feedbackMetric(client:SupabaseClient,bounds:PeriodBounds,filters:StatisticFilters,key:string){
  const student=numberFilter(filters,"student"),style=numberFilter(filters,"style");
  if(key==="feedback_credits_purchased"||key==="feedback_credits_consumed"){
    type Row={delta_credits:number};
    const movement=key==="feedback_credits_purchased"?"purchase":"consumption";
    const rows=await collectPages<Row>(async(from,to)=>{
      let query=client.from("feedback_credit_ledger").select("delta_credits").eq("movement_type",movement).gte("created_at",bounds.fromIso).lt("created_at",bounds.toIso);
      if(student)query=query.eq("person_id",student);
      const result=await query.range(from,to);
      return {data:(result.data??[]) as Row[],error:result.error};
    });
    return rows.reduce((sum,row)=>sum+(movement==="purchase"?Math.max(0,row.delta_credits):Math.abs(Math.min(0,row.delta_credits))),0);
  }
  if(key==="feedback_submitted"||key==="feedback_completed"){
    const column=key==="feedback_submitted"?"submitted_at":"completed_at";
    let query=client.from("feedback_requests").select("id",{count:"exact",head:true}).not(column,"is",null).gte(column,bounds.fromIso).lt(column,bounds.toIso);
    if(student)query=query.eq("person_id",student);
    if(style)query=query.eq("style_term_id",style);
    return exactCount(query);
  }
  if(key==="feedback_pending"){
    type Row={submitted_at:string|null;completed_at:string|null;cancelled_at:string|null};
    const rows=await collectPages<Row>(async(from,to)=>{
      let query=client.from("feedback_requests").select("submitted_at,completed_at,cancelled_at").not("submitted_at","is",null).lt("submitted_at",bounds.toIso);
      if(student)query=query.eq("person_id",student);
      if(style)query=query.eq("style_term_id",style);
      const result=await query.range(from,to);
      return {data:(result.data??[]) as Row[],error:result.error};
    });
    const end=bounds.to.getTime();
    return rows.filter((row)=>{
      const submitted=row.submitted_at?new Date(row.submitted_at).getTime():NaN;
      const completed=row.completed_at?new Date(row.completed_at).getTime():null;
      const cancelled=row.cancelled_at?new Date(row.cancelled_at).getTime():null;
      return Number.isFinite(submitted)&&submitted<end&&(completed==null||completed>=end)&&(cancelled==null||cancelled>=end);
    }).length;
  }
  if(key==="feedback_response_hours"){
    type Row={submitted_at:string|null;completed_at:string|null};
    const rows=await collectPages<Row>(async(from,to)=>{
      let query=client.from("feedback_requests").select("submitted_at,completed_at").not("submitted_at","is",null).not("completed_at","is",null).gte("completed_at",bounds.fromIso).lt("completed_at",bounds.toIso);
      if(student)query=query.eq("person_id",student);
      if(style)query=query.eq("style_term_id",style);
      const result=await query.range(from,to);
      return {data:(result.data??[]) as Row[],error:result.error};
    });
    const hours=rows.map((row)=>row.submitted_at&&row.completed_at?(new Date(row.completed_at).getTime()-new Date(row.submitted_at).getTime())/3_600_000:NaN).filter((value)=>Number.isFinite(value)&&value>=0);
    return hours.length?Math.round(hours.reduce((sum,value)=>sum+value,0)*10/hours.length)/10:null;
  }
  throw new Error("Métrica de Feedback Online no soportada.");
}

export async function calculateStatistic'''
          text=one(text,anchor,helper,'statistics feedback helper')
          text=one(text,
            '  else if(metric.block==="bz")value=await bzMetric(client,bounds,filters,metricKey);\n  else if(metric.block==="marketing")',
