            'reset feedback label')
          reset.write_text(text)
          PY
      - name: Verify anchors
        run: |
          grep -q 'feedback: "Feedback Online"' app/statistics-catalog.ts
          grep -q 'feedback_response_hours' app/statistics-engine.ts
          grep -q '\["feedback", "Feedback Online"\]' app/admin-data-transfer.tsx
          grep -q 'feedback_online: "registros de Feedback Online"' app/admin-data-reset.tsx
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/integrate-feedback-transversal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/statistics-catalog.ts app/statistics-engine.ts app/admin-data-transfer.tsx app/admin-data-reset.tsx .github/workflows/integrate-feedback-transversal.yml
          git commit -m "Integrate Feedback Online across data and statistics"
          git push origin HEAD:feat/postrelease-feedback-online
