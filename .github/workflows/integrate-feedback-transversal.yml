name: Integrate Feedback transversal

on:
  push:
    branches:
      - feat/postrelease-feedback-online
    paths:
      - .github/workflows/integrate-feedback-transversal.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/postrelease-feedback-online
          fetch-depth: 0
      - name: Align patch script with current transfer UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("scripts/patch-feedback-transversal.py")
          text=path.read_text()
          old='text = one(text, \'  ["bz", "BZ Points y recompensas"],\\n];\\n\', \'  ["bz", "BZ Points y recompensas"],\\n  ["feedback", "Feedback Online"],\\n];\\n\', "import feedback domain")'
          new='text = one(text, \'  ["bz", "BZ Points y recompensas"],\\n  ["complete", "Copia CYA completa"],\', \'  ["bz", "BZ Points y recompensas"],\\n  ["feedback", "Feedback Online"],\\n  ["complete", "Copia CYA completa"],\', "import feedback domain")'
          if old not in text:
              raise SystemExit("import-domain patch-script anchor missing")
          text=text.replace(old,new,1)
          old='text = one(text, \'    setBusy("preview-import");\\n    try {\\n      const parsed = await parseImportFile(importFile);\', \'    setBusy("preview-import");\\n    try {\\n      const parsed = await parseImportFile(importFile);\\n      if (parsed.kind === "rows" && importDomain === "feedback") throw new Error("Feedback Online se importa desde una copia JSON exportada por CYA Hub, no desde CSV/Excel plano.");\', "feedback raw import guard")'
          new='text = one(text, \'      const parsed = await parseTransferFile(importFile);\', \'      const parsed = await parseTransferFile(importFile);\\n      if (parsed.kind === "rows" && importDomain === "feedback") throw new Error("Feedback Online se importa desde una copia JSON exportada por CYA Hub, no desde CSV/Excel plano.");\', "feedback raw import guard")'
          if old not in text:
              raise SystemExit("raw-import patch-script anchor missing")
          path.write_text(text.replace(old,new,1))
          PY
      - name: Patch
        run: python scripts/patch-feedback-transversal.py
      - name: Verify
        run: |
          grep -q 'feedback: "Feedback Online"' app/statistics-catalog.ts
          grep -q 'feedback_response_hours' app/statistics-engine.ts
          grep -q '\["feedback", "Feedback Online"\]' app/admin-data-transfer.tsx
          grep -q 'feedback_online: "registros de Feedback Online"' app/admin-data-reset.tsx
      - name: Commit
        run: |
          rm .github/workflows/integrate-feedback-transversal.yml
          rm scripts/patch-feedback-transversal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/statistics-catalog.ts app/statistics-engine.ts app/admin-data-transfer.tsx app/admin-data-reset.tsx .github/workflows/integrate-feedback-transversal.yml scripts/patch-feedback-transversal.py
          git commit -m "Integrate Feedback Online across data and statistics"
          git push origin HEAD:feat/postrelease-feedback-online
