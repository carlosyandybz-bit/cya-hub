name: Integrate Feedback transversal

on:
  push:
    branches:
      - feat/postrelease-feedback-online
    paths:
      - .github/workflows/integrate-feedback-transversal.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/postrelease-feedback-online
          fetch-depth: 0
      - name: Patch
        run: python scripts/patch-feedback-transversal.py
      - name: Verify
        run: |
          grep -q 'feedback: "Feedback Online"' app/statistics-catalog.ts
          grep -q 'feedback_response_hours' app/statistics-engine.ts
          grep -q '\["feedback", "Feedback Online"\]' app/admin-data-transfer.tsx
          grep -q 'feedback_online: "registros de Feedback Online"' app/admin-data-reset.tsx
      - name: Commit
        run: |
          rm .github/workflows/integrate-feedback-transversal.yml
          rm scripts/patch-feedback-transversal.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/statistics-catalog.ts app/statistics-engine.ts app/admin-data-transfer.tsx app/admin-data-reset.tsx .github/workflows/integrate-feedback-transversal.yml scripts/patch-feedback-transversal.py
          git commit -m "Integrate Feedback Online across data and statistics"
          git push origin HEAD:feat/postrelease-feedback-online
