name: P0C documentation sync runner

on:
  push:
    branches: [p0c-doc-sync]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0c-doc-sync
          fetch-depth: 0
      - name: Execute sync script from the reviewed temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p0c-doc-sync.yml').read_text()
          start = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/p0c-doc-sync.py').write_text(script)
          PY
          python /tmp/p0c-doc-sync.py
          grep -q 'CYA-AUD-007.*RESUELTO — P0C' docs/CYA_HUB_AUDITORIA_VIVA_LANZAMIENTO.md
          grep -q 'CYA-AUD-013.*P0E' docs/CYA_HUB_AUDITORIA_VIVA_LANZAMIENTO.md
          grep -q 'P0C ✅' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          grep -q 'P0E ⏳ SIGUIENTE CORRECTIVO' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
      - name: Commit docs and remove temporary workflows
        shell: bash
        run: |
          rm .github/workflows/p0c-doc-sync.yml .github/workflows/p0c-doc-sync-runner.yml
          git config user.name 'cya-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/CYA_HUB_AUDITORIA_VIVA_LANZAMIENTO.md docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md .github/workflows/p0c-doc-sync.yml .github/workflows/p0c-doc-sync-runner.yml
          git commit -m 'Sync P0C closure and P0E audit state'
          git push origin HEAD:p0c-doc-sync
