name: Statistics v123 build proof
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/statistics-v123-build-proof.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qlngfkzmncihtdzktcmd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9weuqXYkEgvbLDoBg1kk5Q_PBxV-haW
    steps:
      - uses: actions/checkout@v4
        with: { ref: staging }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record success
        run: |
          mkdir -p .qa
          printf 'statistics-v123 build ok\n' > .qa/statistics-v123-build-ok.txt
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add .qa/statistics-v123-build-ok.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record statistics v123 build success"
          git push origin HEAD:staging
