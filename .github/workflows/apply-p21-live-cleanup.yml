name: Apply P21 live cleanup

on:
  push:
    branches:
      - p21/dar-clase-definitivo
    paths:
      - 'tools/p21_apply_live_cleanup.py'
      - '.github/workflows/apply-p21-live-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p21/dar-clase-definitivo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact P21.2 cleanup
        run: python tools/p21_apply_live_cleanup.py
      - name: Regressions
        run: node --test tests/p21-dar-clase.test.mjs tests/start-class-transition.test.mjs tests/class-summary-content-editor.test.mjs tests/p19-persona-unica.test.mjs tests/p17-evaluation-cutover.test.mjs
      - name: Lint
        run: npx eslint app/cya-app.tsx app/class-summary-content-editor.tsx app/person-identity-editor.tsx
      - name: Build
        run: npm run build
      - name: Persist cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes to persist'
            exit 0
          fi
          git config user.name 'cya-hub-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/cya-app.tsx app/evaluation-final-model.css tests/p17-evaluation-cutover.test.mjs tests/p21-dar-clase.test.mjs docs/P21_DAR_CLASE_RECONCILIACION.md
          git commit -m 'P21.2: clean live class workspace'
          git push origin HEAD:p21/dar-clase-definitivo
