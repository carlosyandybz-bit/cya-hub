name: Validate Point 12 evaluation model
on:
  push:
    branches: [feat/point12-evaluation-model]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Point 12 patch
        run: python scripts/apply-point12.py
      - name: Install dependencies
        run: npm ci
      - name: Point 12 and class regressions
        run: |
          node --test tests/evaluation-model-point12.test.mjs
          node --test tests/class-workflow-point10.test.mjs
          node --test tests/live-class-search-point11.test.mjs
          node --test tests/live-class-polish-point11b.test.mjs
          node --test tests/point8-final-close-v30.test.mjs
          node --test tests/no-real-time-class-duration.test.mjs
          node --test tests/numeric-inputs.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing suite
        run: npm test
      - name: Diff integrity
        run: git diff --check
      - name: Commit validated functional files
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/student-detail.tsx app/student-detail.module.css supabase/v34-evaluation-sessions.sql tests/evaluation-model-point12.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Implement Point 12 evaluation model"
            git push
          fi
