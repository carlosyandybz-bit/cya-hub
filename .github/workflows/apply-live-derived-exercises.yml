name: Apply live derived exercises

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/apply-live-derived-exercises.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Replace class-owned exercise card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/cya-app.tsx')
          s=p.read_text()
          anchor='import { StudentExercisesPanel } from "./student-exercises-panel";'
          if 'LiveStudentExercises' not in s:
              if anchor not in s:
                  raise SystemExit('import anchor missing')
              s=s.replace(anchor,anchor+'\nimport { LiveStudentExercises } from "./live-student-exercises";',1)
          start=s.find('<article className="card live-card exercise-card"><div className="live-card-head"><div><p className="eyebrow">Solo esta clase</p><h2>Ejercicios</h2>')
          if start < 0:
              raise SystemExit('old exercise card start missing')
          end_marker='</article></section> : null}'
          end=s.find(end_marker,start)
          if end < 0:
              raise SystemExit('old exercise card end missing')
          replacement='<LiveStudentExercises client={db!} personId={activePersonId} classId={item.id} participantCount={item.class_participants.length} classEvents={events} notify={notify} onChanged={loadLive} /></section> : null}'
          s=s[:start]+replacement+s[end+len(end_marker):]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use student-derived exercises during live class"
          git push origin HEAD:staging
