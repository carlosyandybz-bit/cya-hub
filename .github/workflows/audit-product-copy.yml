name: Audit product copy

on:
  push:
    branches: [audit/postrelease-product-copy]
    paths:
      - '.github/workflows/audit-product-copy.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find technical language in application surfaces
        shell: python
        run: |
          from pathlib import Path
          import re

          terms = re.compile(r"\b(migraci(?:ón|ones)|schema|supabase|postgres(?:ql)?|\bRLS\b|runtime|deploy(?:ment)?|despliegue|arquitectura|motor(?:es)?|API|P(?:1[89]|2[0-9]|3[0-2])|versionad[oa]|idempotent[ea]|backend|frontend|edge function|RPC|SQL|GitHub|Hostinger)\b", re.I)
          stringish = re.compile(r"[\"'`](.*?)[\"'`]")
          hits = []
          for path in sorted(Path("app").rglob("*")):
              if path.suffix not in {".ts", ".tsx"}: continue
              for lineno, line in enumerate(path.read_text(encoding="utf8").splitlines(), 1):
                  if not terms.search(line): continue
                  if line.lstrip().startswith(("import ", "type ", "interface ", "//", "/*", "*")): continue
                  hits.append((str(path), lineno, line.strip()))
          print(f"TECHNICAL_COPY_CANDIDATES={len(hits)}")
          for path, lineno, line in hits:
              print(f"{path}:{lineno}: {line}")
