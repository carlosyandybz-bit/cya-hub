name: Questionnaire v107 build proof
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/questionnaire-v107-build-proof.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qlngfkzmncihtdzktcmd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_9weuqXYkEgvbLDoBg1kk5Q_PBxV-haW
    steps:
      - uses: actions/checkout@v4
        with: { ref: staging }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Record result
        if: always()
        run: |
          mkdir -p .qa
          if [ "${{ job.status }}" = "success" ]; then printf 'questionnaire-v107 build ok\n' > .qa/questionnaire-v107-build-result.txt; else printf 'questionnaire-v107 build failed\n' > .qa/questionnaire-v107-build-result.txt; fi
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add .qa/questionnaire-v107-build-result.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record questionnaire v107 build result"
          git push origin HEAD:staging
