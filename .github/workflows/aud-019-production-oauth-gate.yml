name: AUD-019 Production OAuth Gate

on:
  push:
    branches:
      - audit/aud-019-prod-oauth-gate
    paths:
      - '.github/workflows/aud-019-production-oauth-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  production-oauth-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_ORIGIN: https://app.carlosyandy.com
      SUPABASE_URL: https://ldvyeyhzrepaaouzavgs.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.CYA_QA_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_gTLCF5jffNzTC_mRZ21IPg_wl-70wQL' }}
      CYA_QA_BOOTSTRAP_URL: https://ldvyeyhzrepaaouzavgs.supabase.co/functions/v1/cya-qa-bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Bootstrap isolated admin identity via GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cya-hub-qa")"
          oidc_token="$(jq -er '.value' <<<"${oidc_json}")"
          bootstrap_json="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            "${CYA_QA_BOOTSTRAP_URL}")"
          email="$(jq -er '.credentials.admin.email' <<<"${bootstrap_json}")"
          password="$(jq -er '.credentials.admin.password' <<<"${bootstrap_json}")"
          echo "::add-mask::${email}"
          echo "::add-mask::${password}"
          printf 'QA_ADMIN_EMAIL=%s\n' "${email}" >> "${GITHUB_ENV}"
          printf 'QA_ADMIN_PASSWORD=%s\n' "${password}" >> "${GITHUB_ENV}"

      - name: Authenticate QA admin against production Supabase
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg email "${QA_ADMIN_EMAIL}" --arg password "${QA_ADMIN_PASSWORD}" '{email:$email,password:$password}')"
          auth_json="$(curl --fail --silent --show-error \
            -X POST \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "${SUPABASE_URL}/auth/v1/token?grant_type=password")"
          access_token="$(jq -er '.access_token' <<<"${auth_json}")"
          echo "::add-mask::${access_token}"
          printf 'QA_ACCESS_TOKEN=%s\n' "${access_token}" >> "${GITHUB_ENV}"

      - name: Verify deployed build and Calendar runtime preconditions
        shell: bash
        run: |
          set -euo pipefail
          build_json="$(curl --fail --silent --show-error "${PROD_ORIGIN}/api/build-info")"
          status_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${QA_ACCESS_TOKEN}" \
            "${PROD_ORIGIN}/api/google-calendar/status")"

          commit="$(jq -r '.commit // "unknown"' <<<"${build_json}")"
          configured="$(jq -r '.configured' <<<"${status_json}")"
          missing="$(jq -c '.missingRequirements // []' <<<"${status_json}")"
          message="$(jq -r '.configurationMessage // ""' <<<"${status_json}")"

          {
            echo '### AUD-019 production runtime'
            echo "- build commit: \`${commit}\`"
            echo "- calendar configured: \`${configured}\`"
            echo "- missing requirements: \`${missing}\`"
            echo "- runtime message: ${message}"
          } >> "${GITHUB_STEP_SUMMARY}"

          test "${configured}" = "true"
          test "${missing}" = "[]"

      - name: Start OAuth from the real production runtime
        shell: bash
        run: |
          set -euo pipefail
          connect_json="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${QA_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${PROD_ORIGIN}/api/google-calendar/connect")"
          oauth_url="$(jq -er '.url' <<<"${connect_json}")"
          echo "::add-mask::${oauth_url}"
          printf 'OAUTH_URL=%s\n' "${oauth_url}" >> "${GITHUB_ENV}"

          node -e '
            const u = new URL(process.env.OAUTH_URL);
            if (u.origin !== "https://accounts.google.com") throw new Error(`Unexpected OAuth origin: ${u.origin}`);
            const redirect = u.searchParams.get("redirect_uri");
            if (redirect !== "https://app.carlosyandy.com/api/google-calendar/callback") throw new Error(`Unexpected redirect_uri: ${redirect}`);
            if (!u.searchParams.get("client_id")) throw new Error("Missing Google client_id");
            const scope = u.searchParams.get("scope") || "";
            if (!scope.includes("calendar.events") || !scope.includes("calendar.calendarlist.readonly")) throw new Error("Missing Calendar scopes");
          '

      - name: Verify Google accepts the OAuth request before user consent
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
          cat > /tmp/aud019.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const response = await page.goto(process.env.OAUTH_URL, { waitUntil: 'domcontentloaded', timeout: 60000 });
          const url = page.url();
          const body = (await page.locator('body').innerText()).slice(0, 12000);
          if (!response || response.status() >= 500) throw new Error(`Google OAuth returned ${response?.status()}`);
          if (/redirect_uri_mismatch/i.test(body) || /Error 400/i.test(body) && /redirect/i.test(body)) {
            throw new Error('Google rejected the production redirect URI');
          }
          if (!url.startsWith('https://accounts.google.com/')) throw new Error(`Unexpected Google OAuth landing URL: ${url}`);
          console.log('Google OAuth request accepted up to the interactive account/consent gate.');
          await browser.close();
          EOF
          node /tmp/aud019.mjs

      - name: Record remaining interactive boundary
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'

          ### Result
          Production runtime, staff authentication, OAuth construction and Google redirect validation passed.
          The only remaining boundary is Google account selection/consent, which must be performed by the user owning the Google Calendar; CI must not store or impersonate that personal Google login.
          EOF
