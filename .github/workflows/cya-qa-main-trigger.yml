name: Trigger CYA QA on direct main pushes

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - '*.md'

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch-main-qa:
    name: Dispatch full CYA QA for direct pushes only
    runs-on: ubuntu-latest
    steps:
      - name: Detect whether main SHA came from a pull request
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_count="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq 'length')"
          if [ "${pr_count}" -gt 0 ]; then
            echo "dispatch=false" >> "${GITHUB_OUTPUT}"
            echo "Main commit is associated with a PR; its PR E2E is the canonical browser gate."
          else
            echo "dispatch=true" >> "${GITHUB_OUTPUT}"
            echo "Direct product-code push detected; full browser QA will run."
          fi

      - name: Run CYA QA E2E on direct main push
        if: steps.source.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cya-qa-e2e.yml --repo "${GITHUB_REPOSITORY}" --ref main
