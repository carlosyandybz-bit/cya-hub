name: Trigger CYA QA on main

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch-main-qa:
    name: Dispatch full CYA QA
    runs-on: ubuntu-latest
    steps:
      - name: Run CYA QA E2E on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cya-qa-e2e.yml --repo carlosyandybz-bit/cya-hub --ref main
