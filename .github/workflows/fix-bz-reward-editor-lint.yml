name: Fix BZ reward editor lint

on:
  push:
    branches: [feat/postrelease-bz-points]
    paths:
      - 'scripts/fix-bz-reward-editor-lint.mjs'
      - '.github/workflows/fix-bz-reward-editor-lint.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-bz-points
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/fix-bz-reward-editor-lint.mjs
      - run: npx eslint app/bz-points-admin.tsx
      - run: git diff --check
      - name: Commit and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix-bz-reward-editor-lint.mjs .github/workflows/fix-bz-reward-editor-lint.yml
          git add app/bz-points-admin.tsx
          git commit -m "Remove redundant reward editor state synchronization"
          git push origin HEAD:feat/postrelease-bz-points
