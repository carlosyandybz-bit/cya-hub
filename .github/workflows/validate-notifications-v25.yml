name: Validate notifications v25

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-notifications-v25.yml

permissions:
  contents: write

jobs:
  validate-notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notifications-v25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate notifications screen
        run: python scripts/apply_notifications_v25.py
      - name: Remove integration helper
        run: rm -f scripts/apply_notifications_v25.py
      - name: Install dependencies
        run: npm ci
      - name: Notifications regression checks
        run: node --test tests/notifications-view.test.mjs
      - name: Visual integrity checks
        run: node --test tests/visual-integrity.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing rendered HTML tests
        run: node --test tests/rendered-html.test.mjs
      - name: Commit validated notifications
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add dedicated notifications center [validated-v25]"
          git push origin HEAD:feat/notifications-v25
