name: Validate profile and preferences pages v24c

on:
  push:
    branches:
      - feat/profile-preferences-pages-v24c
    paths:
      - .github/workflows/validate-profile-preferences-v24c.yml

permissions:
  contents: write

jobs:
  integrate-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-preferences-pages-v24c
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate standalone account pages
        run: python scripts/apply_profile_preferences_pages.py
      - name: Remove temporary integration helpers
        run: rm -f scripts/apply_profile_preferences_pages.py .github/workflows/validate-profile-preferences-v24c.yml
      - name: Install dependencies
        run: npm ci
      - name: Account and settings regression checks
        run: node --test tests/account-menu.test.mjs
      - name: Visual integrity regression checks
        run: node --test tests/visual-integrity.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing rendered HTML tests
        run: node --test tests/rendered-html.test.mjs
      - name: Commit validated account pages
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Make profile and preferences full pages [validated-v24c]"
          git push origin HEAD:feat/profile-preferences-pages-v24c
