name: Apply student-owned learning view

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/apply-student-owned-learning-view.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Decouple live history from search filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/cya-app.tsx')
          s=p.read_text()
          old="const learningForTab=learning.filter((assignment) => assignment.teaching_contents.content_type===contentFilter);"
          new="const learningForTab=learning;"
          if old not in s:
              raise SystemExit('learning filter pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep student learning history visible across live search tabs"
          git push origin HEAD:staging
