name: Validate Point 12R evaluation engine
on:
  push:
    branches: [feat/point12r-evaluation-engine]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.head_commit.message != 'Integrate Point 12R evaluation engine'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix temporary integration matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-point12r.py')
          s=p.read_text()
          old="re.subn(r'<ClassFinalSummary\\b[^>]*?/>',add_terms,s,count=1)"
          new="re.subn(r'<ClassFinalSummary\\b.*?/>',add_terms,s,count=1)"
          if old not in s:
              raise SystemExit('temporary ClassFinalSummary matcher not found')
          p.write_text(s.replace(old,new,1))

          p=Path('scripts/apply-point12r-regressions.py')
          s=p.read_text()
          old="r'''type MediaDraft\\s*=\\s*\\{id:string;file:File;title:string;kind:\"class_document\"\\|\"final_dance\";audience:string;saved:boolean\\};'''"
          new="r'''type MediaDraft\\s*=\\s*\\{\\s*id:string;\\s*file:File;\\s*title:string;\\s*kind:\"class_document\"\\|\"final_dance\";\\s*audience:string;\\s*saved:boolean\\s*\\};'''"
          if old not in s:
              raise SystemExit('temporary MediaDraft matcher not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply Point 12R integration
        run: |
          python3 scripts/apply-point12r.py
          python3 scripts/apply-point12r-regressions.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/cya-app.tsx')
          s=p.read_text()
          s=s.replace('<RadarChart items={relativeRadar} scaleLabel="Porcentaje de tus puntos totales en cada aptitud" />','<RadarChart items={relativeRadar} showValues={false} scaleLabel="Tu forma de progreso muestra fortalezas relativas y áreas a trabajar, sin compararte con otros alumnos." />',1)
          s=s.replace('<strong>{item.score}</strong>','<strong>Valoración guardada</strong>',1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Point 12R and no-function-loss regressions
        run: >-
          node --test
          tests/evaluation-engine-point12r.test.mjs
          tests/point12r-regression-polish.test.mjs
          tests/evaluation-radar-point13.test.mjs
          tests/evaluation-model-point12.test.mjs
          tests/live-class-polish-point11b.test.mjs
          tests/live-class-search-point11.test.mjs
          tests/live-session-dedup.test.mjs
          tests/class-workflow-point10.test.mjs
          tests/point10-student-delivery.test.mjs
          tests/class-close-extras.test.mjs
          tests/class-close-partial-video.test.mjs
          tests/point8-final-close-v30.test.mjs
          tests/compatible-credit-selection.test.mjs
          tests/no-real-time-class-duration.test.mjs
          tests/numeric-inputs.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing suite
        run: npm test
      - name: Diff integrity
        run: git diff --check
      - name: Confirm required integration points
        run: |
          grep -n "InitialEvaluationQuiz\|ClassEvaluationClose" app/cya-app.tsx
          grep -n "EvaluationAdminEditor" app/admin-view.tsx
          grep -n "close_class_pedagogy_v3\|Crear nuevo:" app/cya-app.tsx
          grep -n "in_correction\|Mejorado" app/cya-app.tsx
      - name: Commit validated integration files
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/admin-view.tsx app/student-detail.tsx app/evaluation-engine.tsx app/evaluation-admin.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Integrate Point 12R evaluation engine"
            git push
          fi
