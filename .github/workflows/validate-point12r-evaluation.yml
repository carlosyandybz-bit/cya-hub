name: Validate Point 12R evaluation engine
on:
  push:
    branches: [feat/point12r-evaluation-engine]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.head_commit.message != 'Integrate Point 12R evaluation engine'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix temporary integration matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-point12r.py')
          s=p.read_text()
          old="re.subn(r'<ClassFinalSummary\\b[^>]*?/>',add_terms,s,count=1)"
          new="re.subn(r'<ClassFinalSummary\\b.*?/>',add_terms,s,count=1)"
          if old not in s:
              raise SystemExit('temporary ClassFinalSummary matcher not found')
          p.write_text(s.replace(old,new,1))

          p=Path('scripts/apply-point12r-regressions.py')
          s=p.read_text()
          media_old="r'''type MediaDraft\\s*=\\s*\\{id:string;file:File;title:string;kind:\"class_document\"\\|\"final_dance\";audience:string;saved:boolean\\};'''"
          media_new="r'''type MediaDraft\\s*=\\s*\\{\\s*id:string;\\s*file:File;\\s*title:string;\\s*kind:\"class_document\"\\|\"final_dance\";\\s*audience:string;\\s*saved:boolean\\s*\\};'''"
          if media_old not in s:
              raise SystemExit('temporary MediaDraft matcher not found')
          s=s.replace(media_old,media_new,1)
          state_old='''  const [events,setEvents]=useState<ClassContentEvent[]>([]), [media,setMedia]=useState<MediaDraft[]>([]), [studentMessage,setStudentMessage]=useState(""), [internalNote,setInternalNote]=useState(""), [busy,setBusy]=useState(false), [error,setError]=useState("");'''
          state_real='''  const [events,setEvents] = useState<ClassContentEvent[]>([]), [studentMessage,setStudentMessage] = useState(""), [internalNote,setInternalNote] = useState(""), [media,setMedia] = useState<MediaDraft[]>([]), [busy,setBusy] = useState(false), [error,setError] = useState("");'''
          if state_old not in s:
              raise SystemExit('temporary summary-state matcher not found')
          s=s.replace(state_old,state_real,1)
          p.write_text(s)
          PY
      - name: Apply Point 12R integration
        run: |
          python3 scripts/apply-point12r.py
          python3 scripts/apply-point12r-regressions.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/cya-app.tsx')
          s=p.read_text()
          s=s.replace('<RadarChart items={relativeRadar} scaleLabel="Porcentaje de tus puntos totales en cada aptitud" />','<RadarChart items={relativeRadar} showValues={false} scaleLabel="Tu forma de progreso muestra fortalezas relativas y áreas a trabajar, sin compararte con otros alumnos." />',1)
          s=s.replace('<strong>{item.score}</strong>','<strong>Valoración guardada</strong>',1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test 12R engine
        run: node --test tests/evaluation-engine-point12r.test.mjs
      - name: Test 12R regression polish
        run: node --test tests/point12r-regression-polish.test.mjs
      - name: Test Point 13 radar compatibility
        run: node --test tests/evaluation-radar-point13.test.mjs
      - name: Test Point 12 historical model compatibility
        run: node --test tests/evaluation-model-point12.test.mjs
      - name: Test Point 11B live polish
        run: node --test tests/live-class-polish-point11b.test.mjs
      - name: Test Point 11 search
        run: node --test tests/live-class-search-point11.test.mjs
      - name: Test live-session dedup
        run: node --test tests/live-session-dedup.test.mjs
      - name: Test Point 10 workflow
        run: node --test tests/class-workflow-point10.test.mjs
      - name: Test Point 10 student delivery
        run: node --test tests/point10-student-delivery.test.mjs
      - name: Test class close extras
        run: node --test tests/class-close-extras.test.mjs
      - name: Test class close partial video
        run: node --test tests/class-close-partial-video.test.mjs
      - name: Test Point 8 final close
        run: node --test tests/point8-final-close-v30.test.mjs
      - name: Test compatible credit selection
        run: node --test tests/compatible-credit-selection.test.mjs
      - name: Test no real-time duration
        run: node --test tests/no-real-time-class-duration.test.mjs
      - name: Test numeric inputs
        run: node --test tests/numeric-inputs.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing suite
        run: npm test
      - name: Diff integrity
        run: git diff --check
      - name: Confirm required integration points
        run: |
          grep -n "InitialEvaluationQuiz\|ClassEvaluationClose" app/cya-app.tsx
          grep -n "EvaluationAdminEditor" app/admin-view.tsx
          grep -n "close_class_pedagogy_v3\|Crear nuevo:" app/cya-app.tsx
          grep -n "in_correction\|Mejorado" app/cya-app.tsx
      - name: Commit validated integration files
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/admin-view.tsx app/student-detail.tsx app/evaluation-engine.tsx app/evaluation-admin.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Integrate Point 12R evaluation engine"
            git push
          fi
