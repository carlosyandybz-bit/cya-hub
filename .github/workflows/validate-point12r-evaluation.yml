name: Validate Point 12R evaluation engine
on:
  push:
    branches: [feat/point12r-evaluation-engine]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.head_commit.message != 'Integrate Point 12R evaluation engine'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
