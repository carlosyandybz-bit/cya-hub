name: P27 Notifications

on:
  push:
    branches: [feat/p27-notificaciones-automaticas]
    paths:
      - 'app/notifications-view.tsx'
      - 'app/p27-notifications-admin.tsx'
      - 'app/admin-view.tsx'
      - 'db/migrations/v64_p27_notification_engine.sql'
      - 'db/migrations/v65_p27_notification_reactivation.sql'
      - 'tests/**'
      - 'qa/tests/p27-notifications.spec.ts'
      - '.github/workflows/p27-notifications.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: P27 notification engine contracts
        run: node --test tests/p27-notification-engine.test.mjs tests/p27-notification-reactivation.test.mjs tests/notifications-view.test.mjs
      - name: Preserve P17-P26 contracts
        run: >-
          node --test
          tests/p17-evaluation-cutover.test.mjs
          tests/p0e-optional-evaluation.test.mjs
          tests/p0f-milestone-admin-contract.test.mjs
          tests/p0g-compact-ui.test.mjs
          tests/p18-identity-navigation.test.mjs
          tests/p19-persona-unica.test.mjs
          tests/p20-form-engine.test.mjs
          tests/p21-dar-clase.test.mjs
          tests/p22-student-portal.test.mjs
          tests/p23-teaching-contract.test.mjs
          tests/p24-contextual-home.test.mjs
          tests/p25-missions.test.mjs
          tests/p26-calendar-sync.test.mjs
          tests/documentation-consistency.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Whitespace
        run: git diff --check
