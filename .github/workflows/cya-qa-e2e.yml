name: CYA QA E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Shared QA identities are rotated by the bootstrap, so browser QA remains mutually
# exclusive. The newest run is authoritative: stale runs must never starve the queue.
concurrency:
  group: cya-qa-shared-identities
  cancel-in-progress: true

jobs:
  browser-qa:
    name: Browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.CYA_QA_SUPABASE_URL || 'https://qlngfkzmncihtdzktcmd.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.CYA_QA_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_9weuqXYkEgvbLDoBg1kk5Q_PBxV-haW' }}
      CYA_QA_BOOTSTRAP_URL: https://qlngfkzmncihtdzktcmd.supabase.co/functions/v1/cya-qa-bootstrap

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Refuse production Supabase in QA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${NEXT_PUBLIC_SUPABASE_URL}" == "https://ldvyeyhzrepaaouzavgs.supabase.co" ]]; then
            echo "QA must never target production Supabase" >&2
            exit 1
          fi
          if [[ "${CYA_QA_BOOTSTRAP_URL}" == *"ldvyeyhzrepaaouzavgs"* ]]; then
            echo "QA bootstrap must never target production Supabase" >&2
            exit 1
          fi

      - name: Validate canonical documentation sequence
        run: node --test tests/documentation-consistency.test.mjs

      - name: Bootstrap dedicated QA identities with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=cya-hub-qa")"
          oidc_token="$(jq -er '.value' <<<"${oidc_json}")"

          bootstrap_json="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            "${CYA_QA_BOOTSTRAP_URL}")"

          jq -e --arg run_id "${GITHUB_RUN_ID}" '.ok == true and .run_id == $run_id' <<<"${bootstrap_json}" >/dev/null
          jq -e '.fixtures.studentName and .fixtures.projects["iphone-large-chromium"].classId and .fixtures.projects["desktop-chromium"].classId' <<<"${bootstrap_json}" >/dev/null

          for role in teacher student admin; do
            upper_role="$(printf '%s' "${role}" | tr '[:lower:]' '[:upper:]')"
            email="$(jq -er ".credentials.${role}.email" <<<"${bootstrap_json}")"
            password="$(jq -er ".credentials.${role}.password" <<<"${bootstrap_json}")"
            echo "::add-mask::${password}"
            printf 'QA_%s_EMAIL=%s\n' "${upper_role}" "${email}" >> "${GITHUB_ENV}"
            printf 'QA_%s_PASSWORD=%s\n' "${upper_role}" "${password}" >> "${GITHUB_ENV}"
          done

          printf 'QA_FIXTURES_JSON=%s\n' "$(jq -c '.fixtures' <<<"${bootstrap_json}")" >> "${GITHUB_ENV}"
          printf 'QA_RUN_ID=%s\n' "${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"

      - name: Install application dependencies
        run: npm ci

      - name: Install QA harness
        working-directory: qa
        run: npm install --no-audit --no-fund

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.0-chromium

      - name: Install Chromium system dependencies
        working-directory: qa
        shell: bash
        run: timeout --signal=TERM --kill-after=30s 5m npx playwright install-deps chromium

      - name: Install Chromium for Playwright
        working-directory: qa
        shell: bash
        run: timeout --signal=TERM --kill-after=30s 5m npx playwright install chromium

      - name: Lint application (report existing debt without blocking browser QA)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee qa/lint.log

      - name: Build application
        run: npm run build

      - name: Start CYA Hub locally
        shell: bash
        run: |
          npm start > qa/app-server.log 2>&1 &
          echo $! > qa/app-server.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              echo "CYA Hub is ready"
              exit 0
            fi
            sleep 2
          done
          echo "CYA Hub did not become ready"
          cat qa/app-server.log
          exit 1

      - name: Run browser QA
        working-directory: qa
        run: npm run test:e2e

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: cya-browser-qa-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            qa/app-server.log
            qa/lint.log
          if-no-files-found: warn
          retention-days: 14
