name: CYA QA E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  browser-qa:
    name: Browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER || vars.GCP_WORKLOAD_IDENTITY_PROVIDER || vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT || secrets.GOOGLE_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT || vars.GOOGLE_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON || secrets.GOOGLE_CREDENTIALS || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - uses: actions/checkout@v6

      - name: Detect reusable GCP identity
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GCP_WIF_PROVIDER}" ] && [ -n "${GCP_SERVICE_ACCOUNT}" ]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
            echo "GCP identity source: Workload Identity Federation"
          elif [ -n "${GCP_CREDENTIALS_JSON}" ]; then
            echo "mode=json" >> "$GITHUB_OUTPUT"
            echo "GCP identity source: existing repository credential"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "No reusable GCP identity is configured in GitHub Actions."
          fi

      - name: Authenticate to Google Cloud with WIF
        if: steps.detect.outputs.mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud with existing JSON credential
        if: steps.detect.outputs.mode == 'json'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}

      - name: Set up gcloud
        if: steps.detect.outputs.mode != 'none'
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify OAuth Config write capability without changing anything
        if: steps.detect.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          token="$(gcloud auth print-access-token)"
          echo "::add-mask::${token}"
          found=0
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            result="$(curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${token}" \
              -H 'Content-Type: application/json' \
              "https://cloudresourcemanager.googleapis.com/v1/projects/${project}:testIamPermissions" \
              -d '{"permissions":["clientauthconfig.clients.get","clientauthconfig.clients.update"]}' || true)"
            if echo "$result" | jq -e '.permissions | index("clientauthconfig.clients.update") != null' >/dev/null 2>&1; then
              echo "OAuth Config write permission available on a GCP project."
              found=1
              break
            fi
          done < <(gcloud projects list --format='value(projectId)')
          if [ "$found" -ne 1 ]; then
            echo "No accessible GCP project grants clientauthconfig.clients.update."
            exit 2
          fi

      - name: Fail clearly when no GCP identity exists
        if: steps.detect.outputs.mode == 'none'
        run: |
          echo "GitHub Actions has no GCP identity/credential configured, so it cannot edit Google Auth Platform OAuth clients."
          exit 3
