name: Apply P21 setup and reopen finalization

on:
  push:
    branches:
      - p21/dar-clase-definitivo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'retry finalization workflow')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p21/dar-clase-definitivo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Harden guarded P21.3 transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/p21_finalize_setup_reopen.py')
          text = path.read_text()
          old_sub = 'app, setup_count = setup_pattern.subn(setup_replacement, app, count=1)'
          new_sub = 'app, setup_count = setup_pattern.subn(lambda _match: setup_replacement, app, count=1)'
          if text.count(old_sub) == 1:
              text = text.replace(old_sub, new_sub, 1)
          elif text.count(new_sub) != 1:
              raise SystemExit('could not establish literal-safe setup replacement')
          old_scope = 'item\\.class_type === "pair".*?'
          new_scope = 'item\\.class_type === "pair" && personIds\\[0\\] \\? compatibleCreditsForClass\\(item,credits,personIds\\[0\\]\\) : \\[\\];.*?'
          if text.count(old_scope) == 1:
              text = text.replace(old_scope, new_scope, 1)
          elif text.count(new_scope) != 1:
              raise SystemExit('could not scope setup replacement to ClassSetupStage')
          path.write_text(text)
          PY

      - name: Apply guarded P21.3 and P21.4 transformation
        run: python tools/p21_finalize_setup_reopen.py

      - name: Stabilize P21.3 source assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/p21-dar-clase.test.mjs')
          text = path.read_text()
          old = "  assert.match(setup, /showContextFields=editKnown \\|\\| !roleValue \\|\\| !levelValue/);"
          new = "  assert.ok(setup.includes('showContextFields=editKnown || !roleValue || !levelValue'));"
          if text.count(old) != 1:
              raise SystemExit(f'expected one fragile assertion, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Reconcile global numeric inputs with guided evaluation
        run: |
          python - <<'PY'
          from pathlib import Path
          settings_path = Path('app/evaluation-settings/evaluation-settings-client.tsx')
          settings = settings_path.read_text()
          number_token = 'type="number"'
          if settings.count(number_token) != 4:
              raise SystemExit(f'expected four evaluation settings number inputs, got {settings.count(number_token)}')
          settings = settings.replace(number_token, 'type="text" inputMode="numeric" pattern="[0-9]*"')
          export_anchor = 'export default function EvaluationSettingsClient() {'
          helper = (
              'function integerFormValue(form:FormData,name:string,min:number,max:number) {\n'
              '  const raw=String(form.get(name) ?? "").trim();\n'
              '  if (!/^\\d+$/.test(raw)) return null;\n'
              '  const value=Number(raw);\n'
              '  return Number.isInteger(value) && value>=min && value<=max ? value : null;\n'
              '}\n\n'
          )
          if settings.count(export_anchor) != 1:
              raise SystemExit('evaluation settings export anchor changed')
          settings = settings.replace(export_anchor, helper + export_anchor, 1)
          if settings.count('threshold=Number(form.get("threshold"));') != 2:
              raise SystemExit('unexpected threshold parser count')
          settings = settings.replace('threshold=Number(form.get("threshold"));', 'threshold=integerFormValue(form,"threshold",1,100);')
          if settings.count('!Number.isInteger(threshold) || threshold<1 || threshold>100') != 2:
              raise SystemExit('unexpected threshold validation count')
          settings = settings.replace('!Number.isInteger(threshold) || threshold<1 || threshold>100', 'threshold===null')
          if settings.count('score=Number(form.get("score"));') != 2:
              raise SystemExit('unexpected score parser count')
          settings = settings.replace('score=Number(form.get("score"));', 'score=integerFormValue(form,"score",0,100);')
          if settings.count('!Number.isInteger(score) || score<0 || score>100') != 2:
              raise SystemExit('unexpected score validation count')
          settings = settings.replace('!Number.isInteger(score) || score<0 || score>100', 'score===null')
          settings_path.write_text(settings)

          test_path = Path('tests/numeric-inputs.test.mjs')
          test = test_path.read_text()
          declaration_anchor = 'const evaluationRadar = fs.readFileSync("app/evaluation-radar.tsx", "utf8");\n'
          declaration_replacement = declaration_anchor + (
              'const initialEvaluation = fs.readFileSync("app/evaluation-initial-class.tsx", "utf8");\n'
              'const postEvaluation = fs.readFileSync("app/evaluation-post-class.tsx", "utf8");\n'
              'const evaluationSettings = fs.readFileSync("app/evaluation-settings/evaluation-settings-client.tsx", "utf8");\n'
          )
          if test.count(declaration_anchor) != 1:
              raise SystemExit('numeric test declaration anchor changed')
          test = test.replace(declaration_anchor, declaration_replacement, 1)
          test_start = test.find('test("evaluation keeps five discrete controls instead of a free numeric input", () => {')
          if test_start < 0:
              raise SystemExit('legacy numeric evaluation test start not found')
          test_end = test.find('\n});', test_start)
          if test_end < 0:
              raise SystemExit('legacy numeric evaluation test end not found')
          test_end += len('\n});')
          replacement = (
              'test("guided evaluation uses observable choices instead of a free numeric input", () => {\n'
              '  assert.match(initialEvaluation, /answerOptions\\.map\\(\\(option\\)=><button/);\n'
              '  assert.match(initialEvaluation, /review_evaluation_question/);\n'
              '  assert.doesNotMatch(initialEvaluation, /<input\\b/);\n'
              '  assert.match(postEvaluation, /review_evaluation_question/);\n'
              '  assert.match(postEvaluation, /<select value=\\{currentValue\\}/);\n'
              '  assert.doesNotMatch(postEvaluation, /type="number"/);\n'
              '  assert.match(evaluationRadar, /scale\\.map\\(\\(option\\) => <button/);\n'
              '  assert.match(evaluationRadar, /onChange\\?\\.\\(selected\\.id, option\\.score\\)/);\n'
              '  assert.doesNotMatch(evaluationRadar, /<input\\b/);\n'
              '  assert.match(evaluationSettings, /inputMode="numeric"/);\n'
              '  assert.doesNotMatch(evaluationSettings, /type="number"/);\n'
              '});'
          )
          test_path.write_text(test[:test_start] + replacement + test[test_end:])
          PY

      - name: Fix existing React lint blockers without behavior changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new, label):
              path = Path(path_name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'app/account-pages.tsx',
              '''function ProfileAvatar({ src, name }: { src: string | null; name: string }) {
  const [failed, setFailed] = useState(false);
  useEffect(() => setFailed(false), [src]);
  return (
    <span className={styles.avatar} aria-label={`Foto de ${name || "perfil"}`}>
      {src && !failed ? <img src={src} alt="" onError={() => setFailed(true)} /> : <CircleUserRound />}
    </span>
  );
}''',
              '''function ProfileAvatar({ src, name }: { src: string | null; name: string }) {
  const [failedSrc, setFailedSrc] = useState<string | null>(null);
  const visibleSrc = src && failedSrc !== src ? src : null;
  return (
    <span className={styles.avatar} aria-label={`Foto de ${name || "perfil"}`}>
      {visibleSrc ? <img src={visibleSrc} alt="" onError={() => setFailedSrc(visibleSrc)} /> : <CircleUserRound />}
    </span>
  );
}''',
              'profile avatar effect cleanup',
          )

          replace_once(
              'app/evaluation-radar.tsx',
              'import { useEffect, useMemo, useState } from "react";',
              'import { useMemo, useState } from "react";',
              'evaluation radar import cleanup',
          )
          replace_once(
              'app/evaluation-radar.tsx',
              '''  const [selectedId, setSelectedId] = useState<number | null>(items[0]?.id ?? null);
  useEffect(() => {
    if (!items.length) setSelectedId(null);
    else if (!items.some((item) => item.id === selectedId)) setSelectedId(items[0].id);
  }, [items, selectedId]);

  const selected = items.find((item) => item.id === selectedId) ?? items[0] ?? null;''',
              '''  const [selectedId, setSelectedId] = useState<number | null>(items[0]?.id ?? null);
  const selected = items.find((item) => item.id === selectedId) ?? items[0] ?? null;''',
              'evaluation radar derived selection',
          )

          replace_once(
              'app/student-detail.tsx',
              '''  useEffect(() => {
    const primary=danceProfiles.find((item) => item.is_primary) ?? danceProfiles[0];
    if (!primary) return;
    setEvaluationProfileId((current) => current ?? primary.id);
    setEvaluationLevelId((current) => current ?? primary.level_term_id);
  },[danceProfiles]);

''',
              '',
              'student evaluation default effect cleanup',
          )
          replace_once(
              'app/student-detail.tsx',
              "  const evaluationLevel=terms.find((term) => term.id===evaluationLevelId && term.taxonomy==='dance_level') ?? null;",
              "  const effectiveEvaluationLevelId=evaluationLevelId ?? evaluationProfile?.level_term_id ?? null;\n  const evaluationLevel=terms.find((term) => term.id===effectiveEvaluationLevelId && term.taxonomy==='dance_level') ?? null;",
              'student effective evaluation level',
          )
          replace_once(
              'app/student-detail.tsx',
              "    if (!evaluationProfile || !evaluationLevelId) return setError('Selecciona primero el nivel y el contexto de baile.');",
              "    if (!evaluationProfile || !effectiveEvaluationLevelId) return setError('Selecciona primero el nivel y el contexto de baile.');",
              'student evaluation start guard',
          )
          replace_once(
              'app/student-detail.tsx',
              'p_person_id:student.id,p_level_term_id:evaluationLevelId,p_evaluation_kind:kind',
              'p_person_id:student.id,p_level_term_id:effectiveEvaluationLevelId,p_evaluation_kind:kind',
              'student evaluation rpc level',
          )
          replace_once(
              'app/student-detail.tsx',
              "<select value={evaluationLevelId ?? ''} onChange={(event) => setEvaluationLevelId(event.target.value?Number(event.target.value):null)}>",
              "<select value={effectiveEvaluationLevelId ?? ''} onChange={(event) => setEvaluationLevelId(event.target.value?Number(event.target.value):null)}>",
              'student evaluation level selector',
          )
          replace_once(
              'app/student-detail.tsx',
              "<select value={evaluationProfileId ?? ''} onChange={(event) => setEvaluationProfileId(Number(event.target.value))}>",
              "<select value={evaluationProfile?.id ?? ''} onChange={(event) => setEvaluationProfileId(Number(event.target.value))}>",
              'student evaluation profile selector',
          )
          replace_once(
              'app/student-detail.tsx',
              "disabled={!evaluationLevelId || !evaluationProfile || evaluationBusy==='start'}",
              "disabled={!effectiveEvaluationLevelId || !evaluationProfile || evaluationBusy==='start'}",
              'student evaluation continue guard',
          )

          replace_once(
              'app/teaching-media-editor.tsx',
              '_key: `class-video-${video.id}-${Date.now()}`',
              '_key: `class-video-${video.id}-${video.external_file_id}`',
              'reusable class video deterministic key',
          )
          PY

      - name: P21 and financial regression gate
        run: >-
          node --test
          tests/p21-dar-clase.test.mjs
          tests/point8-final-close-v30.test.mjs
          tests/class-close-extras.test.mjs
          tests/class-close-partial-video.test.mjs
          tests/compatible-credit-selection.test.mjs
          tests/no-real-time-class-duration.test.mjs
          tests/numeric-inputs.test.mjs
          tests/live-session-dedup.test.mjs
          tests/live-class-search-point11.test.mjs
          tests/start-class-transition.test.mjs
          tests/class-summary-content-editor.test.mjs
          tests/p17-evaluation-cutover.test.mjs
          tests/p19-persona-unica.test.mjs

      - name: Lint application
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Reject whitespace errors
        run: git diff --check

      - name: Commit validated finalization
        run: |
          if git diff --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git config user.name 'carlosyandybz-bit'
          git config user.email 'carlosyandy@gmail.com'
          git add app/cya-app.tsx app/account-pages.tsx app/evaluation-radar.tsx app/student-detail.tsx app/teaching-media-editor.tsx app/evaluation-settings/evaluation-settings-client.tsx tests/p21-dar-clase.test.mjs tests/numeric-inputs.test.mjs docs/P21_DAR_CLASE_RECONCILIACION.md tools/p21_finalize_setup_reopen.py
          git commit -m 'P21.4: finalize progressive setup and reopen guard'
          git push origin HEAD:p21/dar-clase-definitivo
