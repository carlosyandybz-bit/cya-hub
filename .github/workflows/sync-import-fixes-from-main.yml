name: Sync durable import fixes from main

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/sync-import-fixes-from-main.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - name: Bring production import fixes into staging without replacing staging import semantics
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main staging
          git checkout origin/main -- app/admin-data-transfer.tsx app/statistics-engine.ts app/student-detail.tsx supabase/historical-student-bonus-import.sql
          # data-transfer-formats-safe.ts is intentionally kept from staging: it already contains
          # the standard-XLSX fix plus the broader correction/explanation/exercise/sequence semantics.
          git config user.name 'CYA Hub Automation'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No changes to sync.'
            exit 0
          fi
          git commit -m 'sync(import): preserve production import fixes in staging'
          git push origin HEAD:staging
