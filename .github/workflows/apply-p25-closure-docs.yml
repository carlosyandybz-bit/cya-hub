name: Apply P25 Closure Docs

on:
  push:
    branches: [docs/p25-closure]
    paths:
      - 'scripts/patch-p25-closure-docs.mjs'
      - '.github/workflows/apply-p25-closure-docs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p25-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact documentation patch
        run: node scripts/patch-p25-closure-docs.mjs
      - name: Documentation contract
        run: node --test tests/documentation-consistency.test.mjs
      - name: P25 contract
        run: node --test tests/p25-missions.test.mjs
      - name: Whitespace
        run: git diff --check
      - name: Materialize closure and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md docs/CYA_HUB_AUDITORIA_VIVA_LANZAMIENTO.md docs/P25_MISIONES.md tests/documentation-consistency.test.mjs
          git rm scripts/patch-p25-closure-docs.mjs .github/workflows/apply-p25-closure-docs.yml
          git commit -m "[docs] Close P25 and hand off P26"
          git push origin HEAD:docs/p25-closure
