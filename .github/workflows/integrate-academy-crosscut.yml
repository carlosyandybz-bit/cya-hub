name: Integrate Academia cross-cut

on:
  push:
    branches: [feat/postrelease-academia-online]
    paths:
      - 'scripts/integrate-academy-crosscut.py'
      - '.github/workflows/integrate-academy-crosscut.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-academia-online
      - name: Apply verified patch
        run: python scripts/integrate-academy-crosscut.py
      - name: Verify application anchors
        run: |
          grep -q 'academy: "Academia Online"' app/statistics-catalog.ts
          grep -q 'async function academyMetric' app/statistics-engine.ts
          grep -q '\["academy", "Academia Online"\]' app/admin-data-transfer.tsx
          grep -q 'academy_online: "registros de Academia Online"' app/admin-data-reset.tsx
      - name: Commit application integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/statistics-catalog.ts app/statistics-engine.ts app/admin-data-transfer.tsx app/admin-data-reset.tsx
          git commit -m 'Integrate Academia with P28 P30 and P32'
          git push origin HEAD:feat/postrelease-academia-online
