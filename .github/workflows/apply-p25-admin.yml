name: Apply P25 Admin Patch

on:
  push:
    branches:
      - feat/p25-mission-expiry-engine
    paths:
      - scripts/patch-p25-admin.mjs
      - tests/p25-missions.test.mjs
      - .github/workflows/apply-p25-admin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p25-mission-expiry-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact admin patch
        run: node scripts/patch-p25-admin.mjs
      - name: Install
        run: npm ci
      - name: P25 contract
        run: node --test tests/p25-missions.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Materialize patch and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin-view.tsx
          git rm scripts/patch-p25-admin.mjs .github/workflows/apply-p25-admin.yml
          git commit -m "[p25] Configure mission expiry UI"
          git push origin HEAD:feat/p25-mission-expiry-engine
