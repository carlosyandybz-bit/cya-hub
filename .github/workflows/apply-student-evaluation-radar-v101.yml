name: Apply student evaluation radar v101
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/apply-student-evaluation-radar-v101.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: staging }
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/student-portal-prf.tsx')
          s=p.read_text()
          anchor='import { FeedbackOnlineStudentPanel } from "./feedback-online-student";'
          if 'from "./evaluation-radar"' not in s:
              s=s.replace(anchor,anchor+'\nimport { EvaluationRadar } from "./evaluation-radar";',1)
          old='''type PortalEvaluation = {\n  id: number;\n  score: number;\n  aptitude_term_id: number;\n  aptitude: string;\n  style: string;\n  role: string;\n  level: string;\n  created_at: string;\n};'''
          new='''type PortalEvaluation = {\n  id: number;\n  aptitude_term_id: number;\n  aptitude: string;\n  style: string;\n  role: string;\n  level: string;\n  created_at: string;\n};\ntype PortalEvaluationSummaryItem = { aptitude_term_id:number; aptitude:string; stars:number; total_stars:number; trend:-1|0|1|null };\ntype PortalEvaluationSummaryContext = { style_term_id:number; style:string; role_term_id:number; role:string; level_term_id:number; level:string; is_primary:boolean; evaluated_at:string|null; has_evaluation:boolean; items:PortalEvaluationSummaryItem[] };\ntype PortalEvaluationSummary = { mode:"evaluations"|"time"; reference_count:number; period_value:number; period_unit:"day"|"week"|"month"; contexts:PortalEvaluationSummaryContext[] };'''
          if old not in s: raise SystemExit('PortalEvaluation type anchor missing')
          s=s.replace(old,new,1)
          snap='''  evaluations: PortalEvaluation[];\n  class_activity?:'''
          if snap not in s: raise SystemExit('snapshot anchor missing')
          s=s.replace(snap,'''  evaluations: PortalEvaluation[];\n  evaluation_summary?: PortalEvaluationSummary;\n  class_activity?:''',1)
          latest='''  const latestScores = useMemo(() => {\n    const map = new Map<number, PortalEvaluation>();\n    for (const item of snapshot?.evaluations ?? []) if (!map.has(item.aptitude_term_id)) map.set(item.aptitude_term_id, item);\n    return [...map.values()];\n  }, [snapshot?.evaluations]);'''
          replacement='''  const evaluationContext = useMemo(() => snapshot?.evaluation_summary?.contexts.find((item)=>item.is_primary) ?? snapshot?.evaluation_summary?.contexts[0] ?? null,[snapshot?.evaluation_summary]);\n  const studentRadarItems = useMemo(() => (evaluationContext?.items ?? []).map((item)=>({id:item.aptitude_term_id,label:item.aptitude,value:item.total_stars>0?Math.round(item.stars/item.total_stars*100):null,score:null,stars:item.stars,totalStars:item.total_stars,milestoneLabel:null,delta:item.trend})),[evaluationContext]);'''
          if latest not in s: raise SystemExit('latestScores anchor missing')
          s=s.replace(latest,replacement,1)
          old_block='''          <article className={styles.openSection}><div className={styles.sectionHeading}><div><span>TU EVALUACIÓN</span><h2>Última foto de tu progreso</h2></div><strong>{latestScores.length}</strong></div>{latestScores.length ? <div className={styles.scoreList}>{latestScores.map((item) => <div key={item.aptitude_term_id}><span>{item.aptitude}</span><strong>{item.score}</strong></div>)}</div> : <p className={styles.emptyText}>Aún no hemos guardado una evaluación completa. Tu progreso puede seguir construyéndose mientras tanto.</p>}</article>\n\n          <article className={styles.openSection}><div className={styles.sectionHeading}><div><span>DESDE LA ANTERIOR</span><h2>Qué ha mejorado</h2></div><strong>{improvements.length}</strong></div>{improvements.length ? <div className={styles.activityList}>{improvements.map(({ latest, previous, delta }) => <div key={latest.aptitude_term_id}><TrendingUp /><span><strong>{latest.aptitude}</strong><small>{previous.score} → {latest.score} · +{delta} puntos</small></span></div>)}</div> : <p className={styles.emptyText}>Cuando tengamos dos evaluaciones comparables, aquí verás únicamente mejoras respaldadas por tus datos.</p>}</article>\n\n          <article className={styles.openSection}><div className={styles.sectionHeading}><div><span>EVOLUCIÓN</span><h2>Cómo ha ido cambiando</h2></div><strong>{evaluationTimeline.length}</strong></div>{evaluationTimeline.length ? <div className={styles.activityList}>{evaluationTimeline.slice(0, 10).map((item) => <div key={item.id}><CalendarDays /><span><strong>{item.aptitude} · {item.score}</strong><small>{item.style} · {item.level} · {dateLabel(item.created_at, false)}</small></span></div>)}</div> : <p className={styles.emptyText}>Tu historial de evaluación aparecerá aquí a medida que vayamos guardando nuevas fotos de tu progreso.</p>}</article>'''
          new_block='''          <article className={`${styles.openSection} ${styles.studentEvaluationCard}`}><div className={styles.sectionHeading}><div><span>TU EVALUACIÓN</span><h2>Tu progreso dentro de tu nivel</h2></div>{evaluationContext?<strong>{evaluationContext.level}</strong>:null}</div>{evaluationContext?.has_evaluation&&studentRadarItems.length>=3?<><EvaluationRadar items={studentRadarItems} scale={[]} readonly mode="student" showEditor={false} ariaLabel="Resumen de tu progreso"/><p className={styles.evaluationPrivacyNote}>Estas valoraciones representan tu evolución dentro de tu nivel actual. No comparan tu nivel con el de otros alumnos ni parten desde nivel inicial. Las flechas indican si una capacidad mejora, se mantiene o necesita revisión respecto a tu referencia histórica.</p></>:<p className={styles.emptyText}>Aún no hemos guardado una evaluación completa. Tu progreso puede seguir construyéndose mientras tanto.</p>}</article>\n\n          <article className={styles.openSection}><div className={styles.sectionHeading}><div><span>TENDENCIA</span><h2>Dónde estás avanzando</h2></div></div>{evaluationContext?.items.some((item)=>item.trend!==null)?<div className={styles.activityList}>{evaluationContext.items.map((item)=><div key={item.aptitude_term_id}><TrendingUp data-trend={item.trend}/><span><strong>{item.aptitude}</strong><small>{item.trend===1?"Mejorando":item.trend===-1?"Necesita revisión":item.trend===0?"Estable":"Todavía sin referencia"}</small></span></div>)}</div>:<p className={styles.emptyText}>Cuando tengamos evaluaciones comparables, aquí verás la dirección de tu evolución sin puntuaciones ni comparaciones con otras personas.</p>}</article>\n\n          <article className={styles.openSection}><div className={styles.sectionHeading}><div><span>HISTORIAL</span><h2>Tus evaluaciones</h2></div><strong>{evaluationTimeline.length}</strong></div>{evaluationTimeline.length ? <div className={styles.activityList}>{evaluationTimeline.slice(0, 10).map((item) => <div key={item.id}><CalendarDays /><span><strong>{item.aptitude}</strong><small>{item.style} · {item.level} · {dateLabel(item.created_at, false)}</small></span></div>)}</div> : <p className={styles.emptyText}>Tu historial de evaluación aparecerá aquí a medida que vayamos guardando nuevas fotos de tu progreso.</p>}</article>'''
          if old_block not in s: raise SystemExit('progress evaluation block missing')
          s=s.replace(old_block,new_block,1)
          # The old improvements calculation uses private raw scores; remove it completely.
          start=s.find('  const improvements = useMemo(() => {')
          if start>=0:
              end=s.find('\n  const ',start+5)
              if end<0: raise SystemExit('improvements end missing')
              s=s[:start]+s[end:]
          p.write_text(s)

          css=Path('app/student-portal-prf.module.css')
          c=css.read_text()
          marker='/* v101 student evaluation radar */'
          if marker not in c:
              c+='''\n\n/* v101 student evaluation radar */\n.studentEvaluationCard{grid-column:1/-1}.evaluationPrivacyNote{margin:8px 0 0;padding:10px 12px;border-radius:12px;background:var(--cya-surface-subtle);color:var(--cya-text-muted);font-size:11.5px;line-height:1.45}.activityList svg[data-trend="1"]{color:#15945f}.activityList svg[data-trend="-1"]{color:#d34a56}.activityList svg[data-trend="0"]{color:var(--cya-text-muted)}\n'''
              css.write_text(c)
          PY
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/student-portal-prf.tsx app/student-portal-prf.module.css
          git diff --cached --quiet && exit 0
          git commit -m "Show student-safe evaluation stars and trends"
          git push origin HEAD:staging
