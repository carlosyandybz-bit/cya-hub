name: Copy validated product copy changes

on:
  push:
    branches: [feat/postrelease-product-copy-final]
    paths:
      - '.github/workflows/copy-product-copy-final.yml'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-product-copy-final
          fetch-depth: 0
      - name: Copy validated functional files from superseded branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/postrelease-product-copy
          git checkout origin/feat/postrelease-product-copy -- \
            app/admin-data-reset.tsx \
            app/admin-data-transfer.tsx \
            app/admin-form-library.tsx \
            app/admin-view.tsx \
            app/google-calendar-server.ts \
            app/google-drive-server.ts \
            app/p27-notifications-admin.tsx \
            app/p31-appearance-admin.tsx \
            app/p31-integrations-admin.tsx \
            app/statistics-explorer.tsx \
            tests/product-copy.test.mjs
          git add app tests/product-copy.test.mjs
          git commit -m "Replace technical UI copy with product language"
          git push origin HEAD:feat/postrelease-product-copy-final
