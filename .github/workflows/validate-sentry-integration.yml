name: Validate Sentry integration

on:
  push:
    branches:
      - sentry-nextjs-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sentry-nextjs-integration

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile when needed
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: update lockfile for Sentry"
            git push origin HEAD:sentry-nextjs-integration
          fi

      - name: Install dependencies
        run: npm ci

      - name: Existing application lint baseline
        continue-on-error: true
        run: npm run lint

      - name: Strict lint for Sentry integration
        run: npx eslint instrumentation.ts instrumentation-client.ts next.config.ts --max-warnings=0

      - name: Build and rendered HTML tests
        run: npm test
