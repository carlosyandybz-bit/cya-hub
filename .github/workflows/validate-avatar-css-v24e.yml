name: Validate geometric avatar fallback v24e

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-avatar-css-v24e.yml

permissions:
  contents: write

jobs:
  validate-avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace fallback with CSS silhouette
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/account-menu.tsx')
          t=p.read_text()
          old='{showAvatarImage ? <img src={identity.avatar_url ?? ""} alt="" onError={() => setAvatarFailed(true)} /> : <UserRound />}'
          new='{showAvatarImage ? <img src={identity.avatar_url ?? ""} alt="" onError={() => setAvatarFailed(true)} /> : <span className={styles.avatarSilhouette}><span className={styles.avatarHead} /><span className={styles.avatarShoulders} /></span>}'
          if t.count(old)!=1: raise SystemExit(f'expected one fallback, got {t.count(old)}')
          p.write_text(t.replace(old,new,1))
          c=Path('app/account-menu.module.css')
          s=c.read_text()
          marker='.avatarSilhouette{'
          if marker in s: raise SystemExit('silhouette CSS already exists')
          insert='.avatar img{width:100%;height:100%;display:block;object-fit:cover}'
          extra='.avatar img{width:100%;height:100%;display:block;object-fit:cover}.avatarSilhouette{position:relative;width:24px;height:24px;display:block;color:currentColor}.avatarHead{position:absolute;left:50%;top:2px;width:8px;height:8px;transform:translateX(-50%);border:2px solid currentColor;border-radius:50%;box-sizing:border-box}.avatarShoulders{position:absolute;left:50%;bottom:1px;width:18px;height:10px;transform:translateX(-50%);border:2px solid currentColor;border-bottom:0;border-radius:10px 10px 0 0;box-sizing:border-box}'
          if s.count(insert)!=1: raise SystemExit('avatar css anchor mismatch')
          c.write_text(s.replace(insert,extra,1))
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/validate-avatar-css-v24e.yml
      - name: Install dependencies
        run: npm ci
      - name: Strict production build
        run: npm run build
      - name: Account regression tests
        run: node --test tests/account-menu.test.mjs
      - name: Commit validated refinement
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use geometric empty avatar [validated-v24e]"
          git push origin HEAD:fix/avatar-css-v24e
