name: Integrate video upload UI

on:
  push:
    branches: [feat/postrelease-video-compression]
    paths:
      - 'scripts/integrate-video-upload-ui.py'
      - '.github/workflows/integrate-video-upload-ui.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-video-compression
      - run: python scripts/integrate-video-upload-ui.py
      - name: Verify integration
        run: |
          grep -q 'prepareVideoForUpload' app/teaching-media-editor.tsx
          grep -q 'uploadPreparedToDrive' app/teaching-media-editor.tsx
          grep -q 'uploadPreparedFeedback' app/feedback-online-student.tsx
          grep -q 'Vídeo optimizado' app/feedback-online-student.tsx
      - name: Commit UI integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/teaching-media-editor.tsx app/feedback-online-student.tsx
          git commit -m 'Integrate video preparation and direct uploads'
          git push origin HEAD:feat/postrelease-video-compression
