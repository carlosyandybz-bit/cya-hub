name: Apply evaluation radar v101

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/apply-evaluation-radar-v101.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Integrate milestone-first radar
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/context-evaluation-panel-p0f.tsx')
          s=p.read_text()
          imp='import styles from "./context-evaluation-panel.module.css";'
          if 'from "./evaluation-radar"' not in s:
              s=s.replace(imp,'import { EvaluationRadar } from "./evaluation-radar";\n'+imp,1)
          old='  const [busy,setBusy]=useState(""),[error,setError]=useState("");\n  const explicit=Boolean(styleTermId&&roleTermId);'
          new='  const [busy,setBusy]=useState(""),[error,setError]=useState("");\n  const [trendScores,setTrendScores]=useState<Record<string,number>>({}),[trendReferenceAt,setTrendReferenceAt]=useState<string|null>(null),[trendDescription,setTrendDescription]=useState("Sin referencia histórica");\n  const explicit=Boolean(styleTermId&&roleTermId);'
          if old not in s: raise SystemExit('state anchor missing')
          s=s.replace(old,new,1)
          anchor='  const reviewedCount=aptitudes.filter((aptitude)=>evaluations.some((row)=>row.aptitude_term_id===aptitude.id&&Boolean(row.reviewed_at))).length,isCompleteReady=aptitudes.length>0&&reviewedCount===aptitudes.length;\n'
          insertion='''  const reviewedCount=aptitudes.filter((aptitude)=>evaluations.some((row)=>row.aptitude_term_id===aptitude.id&&Boolean(row.reviewed_at))).length,isCompleteReady=aptitudes.length>0&&reviewedCount===aptitudes.length;\n\n  useEffect(()=>{let cancelled=false;async function loadTrend(){if(!session){setTrendScores({});setTrendReferenceAt(null);setTrendDescription("Sin referencia histórica");return;}const result=await client.rpc("get_evaluation_trend_reference",{p_person_id:personId,p_style_term_id:session.style_term_id,p_role_term_id:session.role_term_id,p_level_term_id:session.level_term_id,p_current_session_id:session.id});if(cancelled)return;if(result.error){setTrendScores({});setTrendReferenceAt(null);setTrendDescription("Sin referencia histórica");return;}const data=(result.data??{}) as {mode?:string;referenceCount?:number;periodValue?:number;periodUnit?:string;referenceAt?:string|null;scores?:Record<string,number>};setTrendScores(data.scores??{});setTrendReferenceAt(data.referenceAt??null);if(!data.referenceAt){setTrendDescription("Primera referencia de este nivel");return;}if(data.mode==="time"){const unit=data.periodUnit==="day"?"día":data.periodUnit==="week"?"semana":"mes";setTrendDescription(`Comparado con la evaluación de referencia de hace ${data.periodValue??1} ${unit}${(data.periodValue??1)===1?"":"es"}`);}else setTrendDescription(`Comparado con la referencia de ${data.referenceCount??3} evaluaciones`);}void loadTrend();return()=>{cancelled=true;};},[client,personId,session,evaluations]);\n\n  const radarItems=useMemo(()=>aptitudes.map((aptitude)=>{const row=progress.find((item)=>item.aptitude_term_id===aptitude.id);const evaluation=evaluations.find((item)=>item.aptitude_term_id===aptitude.id);const own=milestones.filter((item)=>item.aptitude_term_id===aptitude.id).sort((a,b)=>a.sort_order-b.sort_order||a.threshold_score-b.threshold_score);const current=own.find((item)=>item.id===row?.current_milestone_id)??null;const stars=current?own.findIndex((item)=>item.id===current.id)+1:0;const totalStars=own.length;const score=evaluation?.reviewed_at?evaluation.score:(row?.raw_score??null);const reference=trendScores[String(aptitude.id)];return {id:aptitude.id,label:aptitude.label,value:totalStars?Math.round(stars/totalStars*100):null,score,milestoneLabel:current?.label??null,stars,totalStars,delta:evaluation?.reviewed_at&&reference!==undefined?evaluation.score-Number(reference):null};}),[aptitudes,evaluations,milestones,progress,trendScores]);\n'''
          if anchor not in s: raise SystemExit('radar calc anchor missing')
          s=s.replace(anchor,insertion,1)
          render_anchor='      <div className={styles.progress}><strong>Evaluación en progreso · {reviewedCount}/{aptitudes.length}</strong><span>{labelFor(session.style_term_id)} · {labelFor(session.role_term_id)} · {labelFor(session.level_term_id)}</span></div>\n      <div className={`${styles.questions} p0f-hito-questions`}'
          radar='''      <div className={styles.progress}><strong>Evaluación en progreso · {reviewedCount}/{aptitudes.length}</strong><span>{labelFor(session.style_term_id)} · {labelFor(session.role_term_id)} · {labelFor(session.level_term_id)}</span></div>\n      <section className={styles.radarPriority} aria-label="Resumen visual de la evaluación"><header><div><span>Vista principal</span><h3>Capacidades de {personName}</h3><p>{trendDescription}{trendReferenceAt?` · ${dateLabel(trendReferenceAt)}`:""}. Las estrellas representan hitos alcanzados dentro de este nivel.</p></div></header><EvaluationRadar items={radarItems} scale={scale.map(({score,term})=>({score,label:term.label}))} mode="teacher" readonly={false} ariaLabel={`Evaluación de ${personName}`} onChange={(aptitudeId,score)=>{const option=scale.find((item)=>item.score===score);if(option)void answerScore(aptitudeId,option.term.id);}} /></section>\n      <div className={styles.detailHeading}><span>Detalle editable</span><strong>Hitos y respuestas por capacidad</strong></div>\n      <div className={`${styles.questions} p0f-hito-questions`}'''
          if render_anchor not in s: raise SystemExit('render anchor missing')
          s=s.replace(render_anchor,radar,1)
          p.write_text(s)

          css=Path('app/context-evaluation-panel.module.css')
          c=css.read_text()
          marker='/* v101 milestone-first evaluation radar */'
          if marker not in c:
              c += '''\n\n/* v101 milestone-first evaluation radar */\n.radarPriority{display:grid;gap:12px;padding:16px;border:1px solid var(--cya-line-strong);border-radius:20px;background:linear-gradient(145deg,var(--cya-surface),var(--cya-surface-subtle));overflow:hidden}.radarPriority>header span{display:block;color:var(--cya-accent);font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.radarPriority>header h3{margin:3px 0 2px;font-size:19px}.radarPriority>header p{margin:0;max-width:74ch;color:var(--cya-text-muted);font-size:12px;line-height:1.45}.detailHeading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px -2px}.detailHeading span{color:var(--cya-accent);font-size:10.5px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}.detailHeading strong{font-size:13px;color:var(--cya-text-secondary)}\n@media(max-width:520px){.radarPriority{padding:12px;border-radius:17px}.radarPriority>header h3{font-size:17px}.detailHeading{display:grid;gap:2px}.detailHeading strong{font-size:12px}}\n'''
              css.write_text(c)
          PY
      - name: Commit radar integration
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/context-evaluation-panel-p0f.tsx app/context-evaluation-panel.module.css
          git diff --cached --quiet && exit 0
          git commit -m "Make milestone radar the primary evaluation view"
          git push origin HEAD:staging
