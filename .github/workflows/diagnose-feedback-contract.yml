name: Diagnose Feedback contract

on:
  push:
    branches:
      - feat/postrelease-feedback-online
    paths:
      - .github/workflows/diagnose-feedback-contract.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Feedback contract only
        run: node --test --test-reporter=spec tests/postrelease-feedback-online.test.mjs
