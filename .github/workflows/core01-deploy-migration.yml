name: CORE-02 Staging Migration Deployment
run-name: CORE-02 staging migration deployment

on:
  push:
    tags:
      - "core01-staging-deploy-pr-*-sha-*"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: core02-staging-migration-deployment
  cancel-in-progress: false

jobs:
  preflight-no-secrets:
    name: Validate trusted pipeline and source data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted pipeline SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install trusted CORE-01 validator tooling
        run: npm ci --prefix tools/core01-validator --ignore-scripts --no-audit --no-fund
      - name: Validate tag, staging SHA, PR, provenance and one SQL blob
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-migration-deployment.mjs --preflight

  deploy-staging:
    name: Apply exactly one authorized migration to STAGING
    needs: preflight-no-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Checkout exact trusted pipeline SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install trusted CORE-01 validator tooling before database secret
        run: npm ci --prefix tools/core01-validator --ignore-scripts --no-audit --no-fund
      - name: Revalidate all source data after Environment approval, before database secret
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-migration-deployment.mjs --preflight
      - name: Apply exact immutable source migration and write deployment evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORE01_STAGING_DATABASE_URL: ${{ secrets.CORE01_STAGING_DATABASE_URL }}
        run: node scripts/verify-migration-deployment.mjs --apply
      - name: Upload authoritative deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: core01-deployment-evidence-${{ github.run_id }}
          path: core01-deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
