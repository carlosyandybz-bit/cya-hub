name: Validate Point 13 evaluation radar
on:
  push:
    branches: [feat/point13-interactive-evaluation-radar]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Point 13 patch
        run: python3 scripts/apply-point13.py
      - name: Install dependencies
        run: npm ci
      - name: Point 13 and regression tests
        run: >-
          node --test
          tests/evaluation-radar-point13.test.mjs
          tests/evaluation-model-point12.test.mjs
          tests/live-class-polish-point11b.test.mjs
          tests/live-class-search-point11.test.mjs
          tests/class-workflow-point10.test.mjs
          tests/class-close-extras.test.mjs
          tests/class-close-partial-video.test.mjs
          tests/no-real-time-class-duration.test.mjs
          tests/numeric-inputs.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing suite
        run: npm test
      - name: Diff integrity
        run: git diff --check
      - name: Commit validated integration files
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/student-detail.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Integrate interactive evaluation radar"
            git push
          fi
