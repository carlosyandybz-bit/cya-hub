name: Restore secondary navigation actions

on:
  push:
    branches:
      - agent/restore-secondary-nav-actions
    paths:
      - .github/workflows/restore-secondary-nav-actions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restore-secondary-nav-actions
          fetch-depth: 0

      - name: Apply secondary navigation repair
        shell: python
        run: |
          from pathlib import Path

          app = Path("app/cya-app.tsx")
          text = app.read_text()

          old_import = "AlertTriangle, Archive, ArrowRight, Bell, BellRing, BookOpen, CalendarDays, CheckCircle2, ChevronRight, CircleUserRound, ClipboardCheck,"
          new_import = "AlertTriangle, Archive, ArrowRight, Bell, BellRing, BookOpen, CalendarDays, CheckCircle2, ChevronDown, ChevronRight, CircleUserRound, ClipboardCheck,"
          if old_import not in text:
              raise SystemExit("cya-app icon import anchor not found")
          text = text.replace(old_import, new_import, 1)

          old_state = '  const [scheduleOpen, setScheduleOpen] = useState(false), [creditOpen, setCreditOpen] = useState(false);'
          new_state = '  const [scheduleOpen, setScheduleOpen] = useState(false), [creditOpen, setCreditOpen] = useState(false), [classQuickMenuOpen, setClassQuickMenuOpen] = useState(false);'
          if old_state not in text:
              raise SystemExit("cya-app state anchor not found")
          text = text.replace(old_state, new_state, 1)

          old_clear = '''    setScheduleOpen(false);\n    setCreditOpen(false);\n    setScheduleStudentId(null);'''
          new_clear = '''    setScheduleOpen(false);\n    setCreditOpen(false);\n    setClassQuickMenuOpen(false);\n    setScheduleStudentId(null);'''
          if old_clear not in text:
              raise SystemExit("cya-app clearTransient anchor not found")
          text = text.replace(old_clear, new_clear, 1)

          old_nav = '''      {!isLiveClassSessionActive ? <nav className="mobile-nav">{nav.map(([id, label, Icon]) => <button key={id} className={`${activeNav(id) ? "active" : ""} ${id === "live" ? "primary" : ""}`} onClick={() => navigateView(id)}><Icon /><span>{label}</span></button>)}</nav> : null}'''
          new_nav = '''      {!isLiveClassSessionActive ? <>\n        <nav className="mobile-nav">{nav.map(([id, label, Icon]) => id === "live" ? <div className="mobile-nav-primary-group" key={id}>\n          <button className={`${activeNav(id) ? "active" : ""} primary`} onClick={() => { setClassQuickMenuOpen(false); navigateView(id); }}><Icon /><span>{label}</span></button>\n          <button type="button" className={`mobile-nav-secondary ${classQuickMenuOpen ? "open" : ""}`} aria-label="Más opciones de clase" aria-expanded={classQuickMenuOpen} onClick={() => setClassQuickMenuOpen((value) => !value)}><ChevronDown /></button>\n        </div> : <button key={id} className={activeNav(id) ? "active" : ""} onClick={() => { setClassQuickMenuOpen(false); navigateView(id); }}><Icon /><span>{label}</span></button>)}</nav>\n        {classQuickMenuOpen ? <div className="mobile-class-sheet" role="menu" aria-label="Opciones de clase">\n          <button type="button" role="menuitem" onClick={() => { setClassQuickMenuOpen(false); openSchedule(); }}><Plus /><span><strong>Programar clase</strong><small>Crear una nueva clase</small></span><ChevronRight /></button>\n          <button type="button" role="menuitem" onClick={() => { setClassQuickMenuOpen(false); navigateView("classes"); }}><GraduationCap /><span><strong>Clases</strong><small>Ver próximas y anteriores</small></span><ChevronRight /></button>\n          <button type="button" role="menuitem" onClick={() => { setClassQuickMenuOpen(false); navigateView("agenda"); }}><CalendarDays /><span><strong>Agenda</strong><small>Ver calendario y planificación</small></span><ChevronRight /></button>\n        </div> : null}\n      </> : null}'''
          if old_nav not in text:
              raise SystemExit("teacher mobile navigation anchor not found")
          text = text.replace(old_nav, new_nav, 1)
          app.write_text(text)

          css = Path("app/globals.css")
          c = css.read_text()
          marker = "/* CYA secondary navigation actions */"
          if marker not in c:
              c += '''\n\n/* CYA secondary navigation actions */\n@media (max-width:720px) {\n  .mobile-nav-primary-group { position:relative; min-width:0; display:grid; place-items:center; align-content:center; }\n  .mobile-nav-primary-group > .primary { width:100%; height:100%; }\n  .mobile-nav .mobile-nav-secondary {\n    position:absolute;\n    z-index:4;\n    top:-14px;\n    right:-5px;\n    width:44px;\n    height:44px;\n    min-height:44px;\n    padding:0;\n    border:3px solid white;\n    border-radius:999px;\n    display:grid;\n    place-items:center;\n    background:#2b2149;\n    color:white;\n    box-shadow:0 8px 20px #211a3240;\n    transition:transform .16s ease, background .16s ease;\n  }\n  .mobile-nav .mobile-nav-secondary svg { width:16px; height:16px; padding:0; border-radius:0; background:transparent; box-shadow:none; color:currentColor; }\n  .mobile-nav .mobile-nav-secondary.open { background:var(--purple2); }\n  .mobile-nav .mobile-nav-secondary.open svg { transform:rotate(180deg); }\n  .mobile-class-sheet {\n    position:fixed;\n    z-index:29;\n    right:14px;\n    bottom:calc(88px + env(safe-area-inset-bottom));\n    left:14px;\n    display:grid;\n    gap:4px;\n    padding:10px;\n    border:1px solid #e1dde8;\n    border-radius:20px;\n    background:#fffffff8;\n    box-shadow:0 18px 50px #211a3230;\n    backdrop-filter:blur(18px);\n  }\n  .mobile-class-sheet > button {\n    min-height:58px;\n    display:grid;\n    grid-template-columns:34px minmax(0,1fr) 20px;\n    align-items:center;\n    gap:10px;\n    padding:8px 10px;\n    border:0;\n    border-radius:14px;\n    background:transparent;\n    color:var(--ink);\n    text-align:left;\n    cursor:pointer;\n  }\n  .mobile-class-sheet > button:active { background:var(--soft); }\n  .mobile-class-sheet > button > svg:first-child { width:22px; color:var(--purple); }\n  .mobile-class-sheet > button > svg:last-child { width:17px; color:#aaa4b6; }\n  .mobile-class-sheet span { min-width:0; display:grid; gap:2px; }\n  .mobile-class-sheet strong { font-size:13px; }\n  .mobile-class-sheet small { color:var(--muted); font-size:11px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .mobile-nav .mobile-nav-secondary { transition:none; }\n}\n'''
          css.write_text(c)

          student_css = Path("app/student-portal-prf.module.css")
          s = student_css.read_text()
          student_marker = "/* Visible split action for Mi formación */"
          if student_marker not in s:
              s += '''\n\n/* Visible split action for Mi formación */\n.formationToggle {\n  z-index:5;\n  top:-12px;\n  right:-8px;\n  width:44px;\n  height:44px;\n  min-height:44px;\n  padding:0;\n  justify-content:center;\n  border:3px solid white;\n  border-radius:999px;\n  background:#2b2149;\n  color:white;\n  box-shadow:0 8px 20px rgba(31,25,55,.22);\n  transition:transform .16s ease, background .16s ease;\n}\n.formationToggle[aria-expanded="true"] { background:var(--prf-purple-dark); }\n.formationToggle[aria-expanded="true"] svg { transform:rotate(180deg); }\n@media (prefers-reduced-motion: reduce) { .formationToggle { transition:none; } }\n'''
          student_css.write_text(s)

          contract = Path("tests/postrelease-global-redesign.test.mjs")
          t = contract.read_text()
          test_anchor = '''test("teacher mobile primary navigation contract is untouched", () => {\n  const inicio = cyaApp.indexOf('["home", "Inicio"');'''
          test_replacement = '''test("teacher central Dar clase keeps a visible secondary class menu without becoming a sixth destination", () => {\n  assert.match(cyaApp, /mobile-nav-primary-group/);\n  assert.match(cyaApp, /aria-label="Más opciones de clase"/);\n  assert.match(cyaApp, /Programar clase/);\n  assert.match(cyaApp, /navigateView\\("classes"\\)/);\n  assert.match(cyaApp, /navigateView\\("agenda"\\)/);\n  assert.match(css, /mobile-nav-secondary/);\n  assert.match(css, /width:44px/);\n});\n\ntest("teacher mobile primary navigation contract is untouched", () => {\n  const inicio = cyaApp.indexOf('["home", "Inicio"');'''
          if test_anchor not in t:
              raise SystemExit("postrelease test anchor not found")
          t = t.replace(test_anchor, test_replacement, 1)

          student_test_anchor = '''  assert.match(nav, /formationMain/);\n  assert.match(nav, /formationToggle/);'''
          student_test_replacement = '''  assert.match(nav, /formationMain/);\n  assert.match(nav, /formationToggle/);\n  assert.match(portal, /aria-expanded={formationMenu}/);\n  assert.match(css, /Visible split action for Mi formación/);'''
          if student_test_anchor not in t:
              raise SystemExit("student split navigation test anchor not found")
          t = t.replace(student_test_anchor, student_test_replacement, 1)
          contract.write_text(t)

          Path(".github/workflows/restore-secondary-nav-actions.yml").unlink()

      - name: Validate focused navigation contracts
        run: node --test tests/postrelease-global-redesign.test.mjs

      - name: Commit repair
        run: |
          git config user.name "CYA Hub QA"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/globals.css app/student-portal-prf.module.css tests/postrelease-global-redesign.test.mjs .github/workflows/restore-secondary-nav-actions.yml
          git commit -m "fix: restore secondary mobile navigation actions"
          git push origin HEAD:agent/restore-secondary-nav-actions
