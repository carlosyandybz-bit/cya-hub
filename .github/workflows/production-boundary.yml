name: Staging isolation boundary

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforce-staging-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce staging-only environment contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            [[ "${GITHUB_BASE_REF}" == "staging" ]] || {
              echo "This workflow only accepts PRs targeting staging." >&2
              exit 1
            }
          else
            [[ "${GITHUB_REF_NAME}" == "staging" ]] || {
              echo "This workflow only accepts staging runs." >&2
              exit 1
            }
          fi

          test -f .env.staging.example
          grep -q '^SENTRY_ENVIRONMENT=staging$' .env.staging.example
          grep -q 'STAGING' .env.staging.example

          if grep -q 'ldvyeyhzrepaaouzavgs' .env.staging.example; then
            echo "::error file=.env.staging.example::Production Supabase project reference found in staging environment template."
            exit 1
          fi

          found=0
          while IFS=: read -r file line text; do
            [[ -z "${file}" ]] && continue
            echo "::error file=${file},line=${line}::Development workflow still targets main: ${text}"
            found=1
          done < <(grep -RInE --include='*.yml' --include='*.yaml' \
            'branches:[[:space:]]*\[main\]|^[[:space:]]*-[[:space:]]*main[[:space:]]*$|--ref[[:space:]]+main|HEAD:main|ref:[[:space:]]*main' \
            .github/workflows || true)

          if [[ "${found}" -ne 0 ]]; then
            echo "One or more development workflows still target main." >&2
            exit 1
          fi

          echo "Staging isolation boundary OK."
