name: P30 Statistics

on:
  push:
    branches: [feat/p30-statistics, main]
    paths:
      - 'app/statistics-*.tsx'
      - 'app/statistics-view.module.css'
      - 'app/admin-statistics.tsx'
      - 'app/admin-daily-quotes.tsx'
      - 'db/migrations/v69_p30_teacher_statistics.sql'
      - 'db/migrations/v70*.sql'
      - 'docs/P30_ESTADISTICAS_CONFIGURABLES.md'
      - 'tests/p30-statistics.test.mjs'
      - '.github/workflows/p30-statistics.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: P30 statistics contracts
        run: node --test tests/p30-statistics.test.mjs
      - name: Preserve P19-P29 contracts
        run: >-
          node --test
          tests/p19-persona-unica.test.mjs
          tests/p20-form-engine.test.mjs
          tests/p21-dar-clase.test.mjs
          tests/p22-student-portal.test.mjs
          tests/p23-teaching-contract.test.mjs
          tests/p24-contextual-home.test.mjs
          tests/p25-missions.test.mjs
          tests/p26-calendar-sync.test.mjs
          tests/p27-notification-engine.test.mjs
          tests/p27-notification-reactivation.test.mjs
          tests/p28-data-transfer.test.mjs
          tests/p29-marketing.test.mjs
          tests/documentation-consistency.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Whitespace
        run: git diff --check
