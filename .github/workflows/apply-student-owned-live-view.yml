name: Apply student-owned live pedagogy view

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/apply-student-owned-live-view.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - name: Show complete student pedagogy history in live class
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/cya-app.tsx')
          s=p.read_text()
          old='[showCorrected,setShowCorrected]=useState(false), [showLearningHistory,setShowLearningHistory]=useState(false)'
          new='[showCorrected,setShowCorrected]=useState(true), [showLearningHistory,setShowLearningHistory]=useState(true)'
          if old not in s:
              raise SystemExit('state pattern not found')
          s=s.replace(old,new,1)
          old2="const corrections=personAssignments.filter((assignment) => assignment.teaching_contents.content_type==='correction'), visibleCorrections=showCorrected ? corrections : corrections.filter((assignment) => assignment.assignment_status!=='corrected');"
          new2="const correctionStatusPriority=(status:string)=>status==='in_correction'?0:status==='pending'?1:status==='corrected'?2:3;\n  const corrections=personAssignments.filter((assignment) => assignment.teaching_contents.content_type==='correction').sort((a,b)=>correctionStatusPriority(a.assignment_status)-correctionStatusPriority(b.assignment_status) || Math.max(b.current_frequency ?? 0,b.current_importance ?? 0)-Math.max(a.current_frequency ?? 0,a.current_importance ?? 0) || new Date(b.updated_at).getTime()-new Date(a.updated_at).getTime()), visibleCorrections=showCorrected ? corrections : corrections.filter((assignment) => assignment.assignment_status!=='corrected');"
          if old2 not in s:
              raise SystemExit('correction pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Show student-wide corrections and learning in live class"
          git push origin HEAD:staging
