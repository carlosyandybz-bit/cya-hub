name: Apply country complete patch

on:
  push:
    branches: [feat/postrelease-country-complete]
    paths:
      - 'scripts/apply-country-complete.mjs'
      - '.github/workflows/apply-country-complete.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-country-complete
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply exact source replacements
        run: node scripts/apply-country-complete.mjs
      - name: Verify country contract
        run: node --test tests/country-presentation.test.mjs
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit functional result and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-country-complete.mjs .github/workflows/apply-country-complete.yml
          git add app/cya-app.tsx app/marketing-view-legacy.tsx app/student-detail.tsx docs/CYA_HUB_POSTRELEASE_BACKLOG.md tests/country-presentation.test.mjs
          git commit -m "Complete country selection and presentation"
          git push origin HEAD:feat/postrelease-country-complete
