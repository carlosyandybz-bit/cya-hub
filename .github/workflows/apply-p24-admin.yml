name: Apply P24 admin integration
on:
  push:
    branches: [feat/p24-contextual-home]
    paths:
      - scripts/apply-p24-admin.mjs
      - .github/workflows/apply-p24-admin.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p24-contextual-home
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-p24-admin.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit final source and remove patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin-view.tsx
          git rm scripts/apply-p24-admin.mjs .github/workflows/apply-p24-admin.yml
          git commit -m "P24: integrate daily quote administration"
          git push origin HEAD:feat/p24-contextual-home
