name: Fix secondary navigation layout

on:
  push:
    branches:
      - agent/restore-secondary-nav-actions
    paths:
      - scripts/fix-secondary-nav-layout.py
      - .github/workflows/fix-secondary-nav-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/restore-secondary-nav-actions
          fetch-depth: 0
      - name: Apply layout correction
        run: python scripts/fix-secondary-nav-layout.py
      - name: Validate focused contracts
        run: node --test tests/postrelease-global-redesign.test.mjs
      - name: Commit correction
        run: |
          git config user.name "CYA Hub QA"
          git config user.email "carlosyandybz@gmail.com"
          git add -A
          git commit -m "fix: isolate secondary action from mobile nav grid"
          git push origin HEAD:agent/restore-secondary-nav-actions
