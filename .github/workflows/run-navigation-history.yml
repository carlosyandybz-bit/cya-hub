name: Validate navigation history patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-navigation-history.yml

permissions:
  contents: write

jobs:
  validate-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/navigation-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped patch
        run: python scripts/apply_navigation_history.py
      - name: Remove temporary patch helpers
        run: rm -f scripts/apply_navigation_history.py .github/workflows/apply-navigation-history.yml
      - name: Install dependencies
        run: npm ci
      - name: Strict production build
        run: npm run build
      - name: Existing rendered HTML checks
        run: node --test tests/rendered-html.test.mjs
      - name: Commit validated branch
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add coherent browser navigation"
          git push origin HEAD:fix/navigation-history
