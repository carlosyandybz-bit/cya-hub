name: Apply staff evaluation overview v101
on:
  push:
    branches: [staging]
    paths: ['.github/workflows/apply-staff-evaluation-overview-v101.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: staging }
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/student-detail.tsx')
          s=p.read_text()
          s=s.replace('import { EvaluationRadar } from "./evaluation-radar";\n','')
          anchor='import { ContextEvaluationPanel } from "./context-evaluation-panel-p0f";'
          if 'StudentEvaluationOverviewStaff' not in s:
              s=s.replace(anchor,anchor+'\nimport { StudentEvaluationOverviewStaff } from "./student-evaluation-overview-staff";',1)
          calc='''  const latestByAptitude = new Map<number, Evaluation>();\n  evaluations.forEach((item) => { if (!latestByAptitude.has(item.aptitude_term_id)) latestByAptitude.set(item.aptitude_term_id, item); });\n  const radarItems = [...latestByAptitude.values()].map((item) => ({ id:item.aptitude_term_id,label:termLabel(item.aptitude_term_id,terms),value:item.score as number|null }));\n  const averageScore = radarItems.length ? Math.round(radarItems.reduce((sum, item) => sum + Number(item.value || 0), 0) / radarItems.length) : null;\n\n'''
          if calc not in s: raise SystemExit('old radar calculation missing')
          s=s.replace(calc,'',1)
          scale="  const evaluationScale=terms.filter((term) => term.taxonomy==='evaluation_scale').map((term) => ({term,score:Number(term.metadata?.score)})).filter(({score}) => [0,25,50,75,100].includes(score)).sort((a,b)=>a.score-b.score);\n\n"
          s=s.replace(scale,'')
          old='''      <div className={styles.evalGrid}><section className={styles.sectionCard}><div className={styles.sectionHead}><div><span>Último estado</span><h3>Evolución por aptitud</h3></div>{averageScore !== null ? <b>{averageScore}/100</b> : null}</div>{radarItems.length ? <EvaluationRadar items={radarItems} scale={evaluationScale.map(({term,score}) => ({score,label:term.label}))} readonly ariaLabel={`Última evaluación de ${student.display_name}`} /> : <div className={styles.empty}><TrendingUp /><span>Todavía no hay evaluaciones.</span></div>}</section><section className={styles.sectionCard}><div className={styles.sectionHead}><div><span>Historial</span><h3>Evaluaciones registradas</h3></div><b>{evaluations.length}</b></div>{evaluations.length ? <div className={styles.historyList}>{evaluations.slice(0, 30).map((item) => <div key={item.id}><div><strong>{termLabel(item.aptitude_term_id, terms)}</strong><span>{dateLabel(item.created_at)} · {termLabel(item.level_term_id,terms)} · {termLabel(item.style_term_id, terms)} · {termLabel(item.role_term_id, terms)}</span>{item.note ? <small>{item.note}</small> : null}</div><b>{item.score}</b></div>)}</div> : <div className={styles.empty}><TrendingUp /><span>Sin historial de evaluación.</span></div>}</section></div>'''
          new='''      <div className={styles.evalGrid}><section className={styles.sectionCard}><StudentEvaluationOverviewStaff client={client} personId={student.id} personName={student.display_name} refreshToken={profileRefresh}/></section><section className={styles.sectionCard}><div className={styles.sectionHead}><div><span>Historial técnico</span><h3>Evaluaciones registradas</h3></div><b>{evaluations.length}</b></div>{evaluations.length ? <div className={styles.historyList}>{evaluations.slice(0, 30).map((item) => <div key={item.id}><div><strong>{termLabel(item.aptitude_term_id, terms)}</strong><span>{dateLabel(item.created_at)} · {termLabel(item.level_term_id,terms)} · {termLabel(item.style_term_id, terms)} · {termLabel(item.role_term_id, terms)}</span>{item.note ? <small>{item.note}</small> : null}</div><b>{item.score}</b></div>)}</div> : <div className={styles.empty}><TrendingUp /><span>Sin historial de evaluación.</span></div>}</section></div>'''
          if old not in s: raise SystemExit('old evaluation render missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/student-detail.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Use milestone evaluation overview in student master profile"
          git push origin HEAD:staging
