name: Apply master plan v3.4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'docs/master-v34-p18-correctives'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch master plan
        run: python scripts/patch-master-v34.py
      - name: Validate master markers
        run: |
          grep -F 'Versión: **3.4**' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          grep -F 'P18 — Identidad, roles, navegación y “Ver como” 🟣 ACTIVO' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          grep -F 'Correctivos adelantados ya implementados durante P18' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          grep -F 'recursión RLS en `student_content_assignments`' docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
      - name: Commit plan if needed
        shell: bash
        run: |
          if git diff --quiet -- docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md
          git commit -m "docs: advance master plan to v3.4 during P18"
          git push origin HEAD:${{ github.head_ref }}
