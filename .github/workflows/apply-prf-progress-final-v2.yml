name: Apply PR-F progress final v2

on:
  push:
    branches:
      - feat/prf-progress-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prf-progress-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply product patch
        run: |
          python .github/scripts/apply-prf-progress-final.py
          python - <<'PY'
          from pathlib import Path
          path = Path('app/student-portal-prf.tsx')
          source = path.read_text(encoding='utf-8')
          old = '  }, [snapshot?.assignments.length, snapshot?.classes, snapshot?.evaluations.length]);'
          new = '  }, [snapshot?.assignments, snapshot?.classes, snapshot?.evaluations]);'
          if old not in source:
              raise SystemExit('memoization dependency anchor not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci
      - name: Contract tests
        run: node --test tests/postrelease-global-redesign.test.mjs
      - name: Lint changed product surface
        run: npx eslint app/student-portal-prf.tsx qa/tests/prf-progress.spec.ts
      - name: Build
        run: npm run build
      - name: Commit clean product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-prf-progress-final.py .github/workflows/apply-prf-progress-final.yml .github/workflows/apply-prf-progress-final-v2.yml
          git add app/student-portal-prf.tsx tests/postrelease-global-redesign.test.mjs qa/tests/prf-progress.spec.ts
          git commit -m "feat: complete evidence-backed student progress"
          git push origin HEAD:feat/prf-progress-final
