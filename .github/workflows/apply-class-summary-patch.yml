name: Apply class summary editor patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/class-summary-edit-rls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch monolith summary integration
        run: python scripts/patch-class-summary-editor.py
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- app/cya-app.tsx; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cya-app.tsx
          git commit -m "P21 corrective: wire editable content into class summary"
          git push origin HEAD:${{ github.head_ref }}
