name: Staging prerequisite derivation patch

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-prerequisite-derivation-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[derivation-editor-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch relation editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/cya-app.tsx')
          s=p.read_text()
          old='''  const ownRelations = relations.filter((relation) => relation.source_content_id === content.id || relation.target_content_id === content.id);\n  const sequenceItems = content.content_type === "sequence" ? relations.filter((relation) => relation.source_content_id === content.id && relation.relation_type === "sequence_item").sort((a,b)=>(a.position??999999)-(b.position??999999)||a.id-b.id) : [];'''
          new='''  const ownRelations = relations.filter((relation) => relation.source_content_id === content.id || relation.target_content_id === content.id);\n  const directPrerequisiteIds = new Set(relations.filter((relation) => relation.relation_type === "prerequisite" && relation.source_content_id === content.id).map((relation) => relation.target_content_id));\n  const inheritedPrerequisiteIds = (() => {\n    const visited = new Set<number>();\n    const queue = [...directPrerequisiteIds];\n    while (queue.length) {\n      const current = queue.shift()!;\n      relations.filter((relation) => relation.relation_type === "prerequisite" && relation.source_content_id === current).forEach((relation) => {\n        if (!visited.has(relation.target_content_id) && !directPrerequisiteIds.has(relation.target_content_id)) { visited.add(relation.target_content_id); queue.push(relation.target_content_id); }\n      });\n    }\n    return visited;\n  })();\n  const derivedPrerequisites = [...inheritedPrerequisiteIds].map((id) => contents.find((item) => item.id === id)).filter((item): item is TeachingContent => Boolean(item));\n  const sequenceItems = content.content_type === "sequence" ? relations.filter((relation) => relation.source_content_id === content.id && relation.relation_type === "sequence_item").sort((a,b)=>(a.position??999999)-(b.position??999999)||a.id-b.id) : [];'''
          if s.count(old)!=1: raise SystemExit(f'ownRelations block matches={s.count(old)}')
          s=s.replace(old,new,1)

          old='''  async function add() {\n    if (!db || !effectiveTargetId) return; setBusy(true); setError("");\n    const nextPosition = relationType === "sequence_item" ? Math.max(0,...sequenceItems.map((item) => item.position ?? 0)) + 10 : null;\n    const result = await db.rpc("save_teaching_relation", { p_source_content_id: content.id, p_target_content_id: effectiveTargetId, p_relation_type: relationType, p_position: nextPosition });\n    if (result.error) setError(result.error.message); else { await saved(); notify("Relación guardada."); }\n    setBusy(false);\n  }'''
          new='''  async function add() {\n    if (!db || !effectiveTargetId) return;\n    if (relationType === "prerequisite" && inheritedPrerequisiteIds.has(effectiveTargetId)) {\n      const inherited = contents.find((item) => item.id === effectiveTargetId);\n      notify(`${inherited?.title ?? "Este contenido"} ya está aprendido por derivación. No se añade una relación redundante.`);\n      return;\n    }\n    setBusy(true); setError("");\n    const nextPosition = relationType === "sequence_item" ? Math.max(0,...sequenceItems.map((item) => item.position ?? 0)) + 10 : null;\n    const result = await db.rpc("save_teaching_relation", { p_source_content_id: content.id, p_target_content_id: effectiveTargetId, p_relation_type: relationType, p_position: nextPosition });\n    if (result.error) setError(result.error.message); else { await saved(); notify(relationType === "prerequisite" ? "Prerrequisito guardado. Las dependencias anteriores se resolverán por derivación." : "Relación guardada."); }\n    setBusy(false);\n  }'''
          if s.count(old)!=1: raise SystemExit(f'add block matches={s.count(old)}')
          s=s.replace(old,new,1)

          old='''</div> : null}<div className="relation-list">{ownRelations.length ? ownRelations.map((relation) => { const otherId = relation.source_content_id === content.id ? relation.target_content_id : relation.source_content_id, other = contents.find((item) => item.id === otherId); return <div key={relation.id}><div><span>{relationLabels[relation.relation_type] ?? relation.relation_type}</span><strong>{other?.title ?? "Contenido archivado"}</strong></div><button className="icon-btn" onClick={() => remove(relation.id)} disabled={busy} aria-label="Quitar relación"><X /></button></div>; }) : <div className="compact-empty"><Link2 /><span>Aún no tiene relaciones.</span></div>}</div>'''
          new='''</div> : null}{derivedPrerequisites.length ? <div className="relation-derived-list"><strong>Aprendido por derivación</strong>{derivedPrerequisites.map((item) => <div className="relation-derived-item" key={`derived-${item.id}`}><span>No necesita relación directa</span><b>{item.title}</b></div>)}</div> : null}<div className="relation-list">{ownRelations.length ? ownRelations.map((relation) => { const otherId = relation.source_content_id === content.id ? relation.target_content_id : relation.source_content_id, other = contents.find((item) => item.id === otherId); return <div key={relation.id}><div><span>{relationLabels[relation.relation_type] ?? relation.relation_type}</span><strong>{other?.title ?? "Contenido archivado"}</strong></div><button className="icon-btn" onClick={() => remove(relation.id)} disabled={busy} aria-label="Quitar relación"><X /></button></div>; }) : derivedPrerequisites.length ? null : <div className="compact-empty"><Link2 /><span>Aún no tiene relaciones.</span></div>}</div>'''
          if s.count(old)!=1: raise SystemExit(f'relation list block matches={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'CYA Staging Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/cya-app.tsx
          git commit -m 'feat(staging): show inherited prerequisites by derivation [derivation-editor-patched]'
          git push origin HEAD:staging
