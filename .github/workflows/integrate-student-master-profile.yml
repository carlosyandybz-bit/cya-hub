name: Integrate student master profile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/integrate-student-master-profile.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/student-master-profile
          fetch-depth: 0
      - name: Apply integration patch
        run: python scripts/patch_student_master_profile.py
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit validated integration to feature branch
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/cya-app.tsx
          git commit -m "Integrate student master profile"
          git push origin HEAD:agent/student-master-profile
