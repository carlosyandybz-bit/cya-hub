name: Staging Block B teaching patch

on:
  push:
    branches: [staging]
    paths:
      - '.github/workflows/staging-block-b-teaching-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[block-b-patched]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch teaching runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          p = Path('app/cya-app.tsx')
          s = p.read_text()

          s = replace_once(s,
          '  description: string | null; correction_guidance: string | null;\n};',
          '  summary: string | null; description: string | null; correction_guidance: string | null; is_mandatory: boolean;\n};',
          'TeachingContentSummary fields')

          s = replace_once(s,
          '    id: number; content_id: number; title: string; content_type: string; description: string | null;\n    correction_guidance: string | null; assignment_status: string;',
          '    id: number; content_id: number; title: string; content_type: string; summary?: string | null; description: string | null;\n    correction_guidance: string | null; is_mandatory?: boolean; assignment_status: string;',
          'student snapshot assignment fields')

          s = replace_once(s,
          'const filtered = contents.filter((content) => content.active && content.content_type === kind).filter((content) => !query.trim() || [content.title,content.description,content.correction_guidance,content.teaching_content_tags.map((tag) => tag.tag).join(" ")].some(',
          'const filtered = contents.filter((content) => content.active && content.content_type === kind).filter((content) => !query.trim() || [content.title,content.summary,content.description,content.correction_guidance,content.teaching_content_tags.map((tag) => tag.tag).join(" ")].some(',
          'library search summary')

          s = replace_once(s,
          'const result = await db.rpc("save_teaching_content_with_media", {',
          'const result = await db.rpc("save_teaching_content_with_media_v2", {',
          'save rpc v2')

          s = replace_once(s,
          '      p_content_id: initial?.id ?? null, p_content_type: type, p_title: String(form.get("title") || "").trim(),\n      p_description:',
          '      p_content_id: initial?.id ?? null, p_content_type: type, p_title: String(form.get("title") || "").trim(),\n      p_summary: ["correction","explanation"].includes(type) ? String(form.get("summary") || "").trim() || null : null,\n      p_is_mandatory: ["explanation","sequence"].includes(type) ? form.get("is_mandatory") === "on" : false,\n      p_description:',
          'save summary mandatory args')

          s = replace_once(s,
          '        <label className="field field-wide"><span>Título *</span><input name="title" required defaultValue={initial?.title ?? ""} autoFocus placeholder="Nombre corto y fácil de encontrar" /></label>\n        <label className="field field-wide"><span>Explicación</span><textarea name="description" rows={3} defaultValue={initial?.description ?? ""} placeholder="Qué necesita entender o hacer el alumno" /></label>',
          '        <label className="field field-wide"><span>Título *</span><input name="title" required defaultValue={initial?.title ?? ""} autoFocus placeholder="Nombre corto y fácil de encontrar" /></label>\n        {["correction","explanation"].includes(type) ? <label className="field field-wide teaching-summary-field"><span>Resumen</span><textarea name="summary" rows={2} maxLength={280} defaultValue={initial?.summary ?? ""} placeholder="Una frase breve para reconocer el contenido sin abrirlo" /></label> : null}\n        <label className="field field-wide"><span>{type === "correction" ? "Detalle adicional" : "Explicación"}</span><textarea name="description" rows={3} defaultValue={initial?.description ?? ""} placeholder={type === "correction" ? "Detalle opcional sobre el error" : "Qué necesita entender o hacer el alumno"} /></label>\n        {["explanation","sequence"].includes(type) ? <label className="field field-wide teaching-mandatory-toggle"><input type="checkbox" name="is_mandatory" defaultChecked={Boolean(initial?.is_mandatory)} /><span><strong>Contenido obligatorio</strong><small>Se resaltará como parte prioritaria del camino pedagógico.</small></span></label> : null}',
          'teaching form summary mandatory controls')

          s = s.replace('title={content.title}\n      subtitle={`', 'title={content.title}\n      summary={content.summary}\n      subtitle={`')
          s = s.replace('title={assignment.teaching_contents.title} subtitle={assignment.teaching_contents.description}', 'title={assignment.teaching_contents.title} summary={assignment.teaching_contents.summary} subtitle={assignment.teaching_contents.description}')
          s = s.replace('title={assignment.title}\n        statusLabel=', 'title={assignment.title}\n        summary={assignment.summary}\n        statusLabel=')

          old_content_select='id,title,content_type,description,correction_guidance,completion_status,publication_status,visibility,measurement_mode,category_term_id,active,requires_partner,published_at,updated_at'
          if old_content_select not in s:
              raise SystemExit('content select pattern not found')
          s=s.replace(old_content_select,'id,title,content_type,summary,description,correction_guidance,is_mandatory,completion_status,publication_status,visibility,measurement_mode,category_term_id,active,requires_partner,published_at,updated_at',1)

          old_assignment_select='teaching_contents!inner(id,title,content_type,measurement_mode,description,correction_guidance)'
          if s.count(old_assignment_select) < 2:
              raise SystemExit(f'assignment select expected >=2, got {s.count(old_assignment_select)}')
          s=s.replace(old_assignment_select,'teaching_contents!inner(id,title,content_type,measurement_mode,summary,description,correction_guidance,is_mandatory)')

          p.write_text(s)

          p = Path('app/teaching-graph.tsx')
          g = p.read_text()
          g = replace_once(g,
          '  description: string | null;\n  correction_guidance: string | null;',
          '  summary: string | null;\n  description: string | null;\n  correction_guidance: string | null;\n  is_mandatory: boolean;',
          'graph content fields')
          g = replace_once(g,
          '  return <article className={`flow-node kind-${data.content.content_type} ${data.selected ? "selected" : ""} ${data.inRoute ? "in-route" : ""}`}>',
          '  return <article className={`flow-node kind-${data.content.content_type} ${data.content.is_mandatory ? "mandatory" : ""} ${data.selected ? "selected" : ""} ${data.inRoute ? "in-route" : ""}`}>',
          'graph mandatory node class')
          g = replace_once(g,
          '    <strong>{data.content.title}</strong>\n    <small>{data.level}',
          '    <strong>{data.content.title}</strong>\n    {data.content.summary ? <em className="flow-node-summary">{data.content.summary}</em> : null}\n    <small>{data.level}',
          'graph node summary')
          g = replace_once(g,
          '    <i>{data.content.completion_status === "complete" ? "Completa" : "Incompleta"}</i>',
          '    <div className="flow-node-flags"><i>{data.content.completion_status === "complete" ? "Completa" : "Incompleta"}</i>{data.content.is_mandatory ? <b>Obligatorio</b> : null}</div>',
          'graph mandatory badge')
          g = replace_once(g,
          '  const [selectedId, setSelectedId] = useState<number | null>(null), [history, setHistory] = useState<number[]>([]), [routeMode, setRouteMode] = useState(false);',
          '  const [selectedId, setSelectedId] = useState<number | null>(null), [history, setHistory] = useState<number[]>([]), [routeMode, setRouteMode] = useState(false), [layoutRevision, setLayoutRevision] = useState(0);',
          'layout revision state')
          g = g.replace('[content.title, content.description, content.correction_guidance]', '[content.title, content.summary, content.description, content.correction_guidance]')
          g = replace_once(g,
          '(grouped.get(columnId) ?? []).sort((a, b) => a.title.localeCompare(b.title, "es")).map((content, rowIndex) => ({',
          '(grouped.get(columnId) ?? []).sort((a, b) => Number(b.is_mandatory)-Number(a.is_mandatory) || ({explanation:0,correction:1,exercise:2,sequence:3}[a.content_type] ?? 9)-({explanation:0,correction:1,exercise:2,sequence:3}[b.content_type] ?? 9) || a.title.localeCompare(b.title, "es")).map((content, rowIndex) => ({',
          'graph semantic ordering')
          g = g.replace('position: { x: columnIndex * 290, y: rowIndex * 150 + (columnIndex % 2) * 35 },','position: { x: columnIndex * 340, y: rowIndex * 190 },')
          g = replace_once(g,
          '      className: `flow-edge relation-${relation.relation_type} ${routeIds ? "route-edge" : ""}`,',
          '      className: `flow-edge relation-${relation.relation_type} ${(contents.find((item)=>item.id===relation.source_content_id)?.is_mandatory || contents.find((item)=>item.id===relation.target_content_id)?.is_mandatory) ? "mandatory-edge" : ""} ${routeIds ? "route-edge" : ""}`,',
          'mandatory edge class')
          g = replace_once(g,
          '  function resetMap() {',
          '  function reorganizeMap() {\n    setLayoutRevision((value) => value + 1);\n    window.setTimeout(() => flow.fitView({ duration: 420, padding: 0.2, maxZoom: 1 }), 0);\n  }\n\n  function resetMap() {',
          'reorganize function')
          g = replace_once(g,
          '      {nodes.length ? <ReactFlow\n        nodes={nodes}',
          '      {nodes.length ? <ReactFlow\n        key={`teaching-layout-${layoutRevision}`}\n        nodes={nodes}',
          'reactflow layout key')
          g = replace_once(g,
          '<Panel position="top-right" className="graph-actions"><button onClick={resetMap}><RotateCcw /> Resetear</button>',
          '<Panel position="top-right" className="graph-actions"><button className="graph-reorganize" onClick={reorganizeMap}><GitBranch /> Reorganizar</button><button onClick={resetMap}><RotateCcw /> Resetear</button>',
          'reorganize button')
          g = replace_once(g,
          '{selected.requires_partner ? <div className="graph-partner-badge">Necesita pareja</div> : null}{selected.description ? <p>{selected.description}</p> : null}',
          '{selected.is_mandatory ? <div className="graph-mandatory-badge">Camino obligatorio</div> : null}{selected.requires_partner ? <div className="graph-partner-badge">Necesita pareja</div> : null}{selected.summary ? <p className="graph-summary">{selected.summary}</p> : null}{selected.description ? <p>{selected.description}</p> : null}',
          'graph detail summary mandatory')
          p.write_text(g)

          p = Path('app/teaching-content-card.module.css')
          c = p.read_text()
          if '.summary{' not in c:
              c += '\n.summary{display:block;margin:1px 0 0;color:var(--cya-text-secondary);font-size:10.75px;line-height:1.35;font-style:italic;white-space:normal;overflow-wrap:anywhere}.detailSummary{margin:4px 0 0!important;color:var(--cya-text-secondary)!important;font-size:12px!important;font-style:italic}.summaryBlock{background:color-mix(in srgb,var(--cya-accent) 5%,var(--cya-surface))}.summaryBlock p{font-style:italic}\n'
          p.write_text(c)
          PY

          git diff --check
          git diff -- app/cya-app.tsx app/teaching-graph.tsx app/teaching-content-card.module.css
          git config user.name 'CYA Staging Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app/cya-app.tsx app/teaching-graph.tsx app/teaching-content-card.module.css
          git commit -m 'feat(staging): Block B summaries mandatory path and graph layout [block-b-patched]'
          git push origin HEAD:staging
