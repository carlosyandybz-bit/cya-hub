name: Finalize BZ reset copy

on:
  push:
    branches: [feat/postrelease-bz-points]
    paths:
      - 'scripts/finalize-bz-copy.mjs'
      - '.github/workflows/finalize-bz-copy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-bz-points
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/finalize-bz-copy.mjs
      - run: git diff --check
      - name: Commit and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/finalize-bz-copy.mjs .github/workflows/finalize-bz-copy.yml
          git add app/admin-data-reset.tsx
          git commit -m "Present BZ reset impact in product language"
          git push origin HEAD:feat/postrelease-bz-points
