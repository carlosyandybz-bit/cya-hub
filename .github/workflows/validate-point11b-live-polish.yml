name: Validate Point 11B live polish
on:
  push:
    branches: [feat/point11b-live-polish]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Point 11B patch
        run: python scripts/apply-point11b.py
      - name: Install dependencies
        run: npm ci
      - name: Point 11B and class regressions
        run: |
          node --test tests/live-class-polish-point11b.test.mjs
          node --test tests/live-class-search-point11.test.mjs
          node --test tests/class-workflow-point10.test.mjs
          node --test tests/live-session-dedup.test.mjs
          node --test tests/no-real-time-class-duration.test.mjs
          node --test tests/numeric-inputs-global.test.mjs
      - name: Strict production build
        run: npm run build
      - name: Existing suite
        run: npm test
      - name: Diff integrity
        run: git diff --check
      - name: Commit validated functional files
        run: |
          git config user.name "carlosyandybz-bit"
          git config user.email "carlosyandybz@gmail.com"
          git add app/cya-app.tsx app/globals.css app/teaching-content-card.tsx app/teaching-content-card.module.css tests/live-class-polish-point11b.test.mjs tests/live-class-search-point11.test.mjs supabase/v33-live-class-polish-permissions.sql
          if ! git diff --cached --quiet; then
            git commit -m "Implement Point 11B live class polish"
            git push
          fi
