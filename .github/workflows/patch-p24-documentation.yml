name: Patch P24 documentation transition

on:
  push:
    branches: [docs/p24-close-p25-handoff]
    paths:
      - 'scripts/patch-p24-documentation.mjs'
      - '.github/workflows/patch-p24-documentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p24-close-p25-handoff
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch canonical documents
        run: node scripts/patch-p24-documentation.mjs
      - name: Normalize changed metadata whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'docs/CYA_HUB_PLAN_MAESTRO_CIERRE.md': {
                  'Versión: **4.3**  ': 'Versión: **4.3**',
                  'Fecha de corte: **2026-08-13**  ': 'Fecha de corte: **2026-08-13**',
                  'Última actualización secuencial cerrada: **P24 / v58–v59**  ': 'Última actualización secuencial cerrada: **P24 / v58–v59**',
              },
              'docs/CYA_HUB_AUDITORIA_VIVA_LANZAMIENTO.md': {
                  'Fecha de corte: **2026-08-13**  ': 'Fecha de corte: **2026-08-13**',
                  'Base funcional actual auditada: `main@50fda0cdbc554f33ae5b5ce0a0d6c6977e66f06f` + Supabase `CyA hub 2` (`ldvyeyhzrepaaouzavgs`)  ': 'Base funcional actual auditada: `main@50fda0cdbc554f33ae5b5ce0a0d6c6977e66f06f` + Supabase `CyA hub 2` (`ldvyeyhzrepaaouzavgs`)',
              },
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for before, after in pairs.items():
                  if before not in text:
                      raise SystemExit(f'missing whitespace target: {before}')
                  text = text.replace(before, after, 1)
              path.write_text(text)
          PY
      - name: Validate documentation contract
        run: node --test tests/documentation-consistency.test.mjs
      - name: Validate whitespace
        run: git diff --check
      - name: Commit transition and remove temporary patcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-p24-documentation.mjs .github/workflows/patch-p24-documentation.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close P24 and hand off to P25'
          git push origin HEAD:docs/p24-close-p25-handoff
