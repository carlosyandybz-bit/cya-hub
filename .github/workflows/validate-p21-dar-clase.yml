name: Validate P21 Dar clase

on:
  pull_request:
    paths:
      - 'app/**'
      - 'supabase/v49_p21_class_workflow_search.sql'
      - 'tests/**'
      - 'docs/P21_DAR_CLASE_RECONCILIACION.md'
      - '.github/workflows/validate-p21-dar-clase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: P21 complete regression gate
        run: >-
          node --test
          tests/p21-dar-clase.test.mjs
          tests/point8-final-close-v30.test.mjs
          tests/class-close-extras.test.mjs
          tests/class-close-partial-video.test.mjs
          tests/compatible-credit-selection.test.mjs
          tests/no-real-time-class-duration.test.mjs
          tests/numeric-inputs.test.mjs
          tests/live-session-dedup.test.mjs
          tests/live-class-search-point11.test.mjs
          tests/start-class-transition.test.mjs
          tests/class-summary-content-editor.test.mjs
          tests/p17-evaluation-cutover.test.mjs
          tests/p19-persona-unica.test.mjs
      - name: Lint complete application
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Reject whitespace errors
        run: git diff --check
