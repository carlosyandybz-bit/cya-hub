name: Run Feedback docs closure

on:
  push:
    branches:
      - feat/postrelease-feedback-online

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/postrelease-feedback-online
          fetch-depth: 0
      - name: Update docs
        run: python scripts/close-feedback-docs.py
      - name: Verify
        run: |
          grep -q 'Estado PR-C · Feedback Online' docs/CYA_HUB_POSTRELEASE_BACKLOG.md
          grep -q 'Completado y desplegado en producción' docs/CYA_HUB_POSTRELEASE_BACKLOG.md
      - name: Commit and clean
        run: |
          rm -f scripts/close-feedback-docs.py
          rm -f .github/workflows/close-feedback-docs.yml
          rm -f .github/workflows/close-feedback-docs-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close PR-C Feedback Online documentation"
          git push origin HEAD:feat/postrelease-feedback-online
