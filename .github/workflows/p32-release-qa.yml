name: P32 Release QA — Staging

on:
  push:
    branches: [staging]
    paths:
      - 'app/**'
      - 'db/migrations/v72*.sql'
      - '.env.example'
      - '.env.staging.example'
      - 'tests/p32-release-qa.test.mjs'
      - 'tests/p32-api-hardening.test.mjs'
      - '.github/workflows/p32-release-qa.yml'
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-staging target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && "${GITHUB_BASE_REF}" != "staging" ]]; then
            echo "Release QA is restricted to PRs targeting staging." >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "staging" ]]; then
            echo "Release QA is restricted to staging pushes." >&2
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: P32 release and CI contracts
        run: node --test tests/p32-release-qa.test.mjs tests/p32-api-hardening.test.mjs tests/ci-workflow-scope.test.mjs tests/country-presentation.test.mjs tests/product-copy.test.mjs tests/notification-grouping.test.mjs tests/aud-017a-teacher-notifications.test.mjs tests/postrelease-bz-points.test.mjs tests/postrelease-feedback-online.test.mjs tests/postrelease-academia-online.test.mjs tests/postrelease-video-compression.test.mjs tests/postrelease-global-redesign.test.mjs tests/prf2-experience-switcher.test.mjs tests/prf2-student-master-detail.test.mjs tests/prf3-admin-grouped-navigation.test.mjs tests/aud-004-archived-content-visibility.test.mjs tests/aud-010a-fk-indexes.test.mjs tests/aud-010b-rls-policy-consolidation.test.mjs tests/aud-011-production-build-fingerprint.test.mjs tests/p36-game-ux-system.test.mjs tests/p36-professor-home.test.mjs tests/p36-students.test.mjs tests/p36-agenda.test.mjs tests/p36-live-class.test.mjs tests/p36-teaching.test.mjs tests/p36-evaluations.test.mjs tests/p36-marketing.test.mjs tests/p36-statistics.test.mjs tests/p36-academy.test.mjs tests/p36-admin-teaching.test.mjs
      - name: Preserve P19-P31 contracts
        run: >-
          node --test
          tests/p19-persona-unica.test.mjs
          tests/p20-form-engine.test.mjs
          tests/p21-dar-clase.test.mjs
          tests/p22-student-portal.test.mjs
          tests/p23-teaching-contract.test.mjs
          tests/p24-contextual-home.test.mjs
          tests/p25-missions.test.mjs
          tests/p26-calendar-sync.test.mjs
          tests/p27-notification-engine.test.mjs
          tests/p27-notification-reactivation.test.mjs
          tests/p28-data-transfer.test.mjs
          tests/p29-marketing.test.mjs
          tests/p30-statistics.test.mjs
          tests/p31-admin-config.test.mjs
          tests/postrelease-teacher-invite.test.mjs
          tests/documentation-consistency.test.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Whitespace
        run: git diff --check
