name: Validate avatar fallback icon v24d

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-avatar-icon-v24d.yml

permissions:
  contents: write

jobs:
  validate-avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Replace double-circle avatar fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/account-menu.tsx')
          text = path.read_text()
          old = '{showAvatarImage ? <img src={identity.avatar_url ?? ""} alt="" onError={() => setAvatarFailed(true)} /> : <CircleUserRound />}'
          new = '{showAvatarImage ? <img src={identity.avatar_url ?? ""} alt="" onError={() => setAvatarFailed(true)} /> : <UserRound />}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one avatar fallback, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/validate-avatar-icon-v24d.yml
      - name: Install dependencies
        run: npm ci
      - name: Strict production build
        run: npm run build
      - name: Account regression tests
        run: node --test tests/account-menu.test.mjs
      - name: Commit validated refinement
        run: |
          git config user.name "CYA Hub automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refine empty avatar icon [validated-v24d]"
          git push origin HEAD:fix/avatar-icon-v24d
