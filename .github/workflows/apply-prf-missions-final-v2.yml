name: Apply PR-F missions final v2

on:
  push:
    branches:
      - feat/prf-missions-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/prf-missions-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply product patch
        run: |
          python .github/scripts/apply-prf-missions-final.py
          python - <<'PY'
          from pathlib import Path
          portal = Path('app/student-portal-prf.tsx')
          source = portal.read_text(encoding='utf-8')
          source = source.replace('  const missionGroups = useMemo(() => {', '  const missionGroups = (() => {', 1)
          source = source.replace('  }, [missions]);\n  const priorityMission = missionGroups.now[0]', '  })();\n  const priorityMission = missionGroups.now[0]', 1)
          portal.write_text(source, encoding='utf-8')

          test = Path('tests/postrelease-global-redesign.test.mjs')
          test_source = test.read_text(encoding='utf-8')
          marker = r'\n\ntest("Misiones final groups the canonical engine without exposing invalid actions", () => {'
          replacement = '\n\ntest("Misiones final groups the canonical engine without exposing invalid actions", () => {'
          if marker not in test_source:
              raise SystemExit('missions contract newline marker not found')
          test.write_text(test_source.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - run: npm ci
      - name: Contract tests
        run: node --test tests/postrelease-global-redesign.test.mjs
      - name: Lint changed product surface
        run: npx eslint app/student-portal-prf.tsx qa/tests/prf-missions.spec.ts
      - name: Build
        run: npm run build
      - name: Commit clean product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply-prf-missions-final.py .github/workflows/apply-prf-missions-final.yml .github/workflows/apply-prf-missions-final-v2.yml
          git add app/student-portal-prf.tsx tests/postrelease-global-redesign.test.mjs qa/tests/prf-missions.spec.ts
          git commit -m "feat: organize student missions by actionable state"
          git push origin HEAD:feat/prf-missions-final
