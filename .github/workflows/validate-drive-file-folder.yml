name: Validate drive.file folder

on:
  push:
    branches:
      - fix/drive-file-folder
    paths:
      - .github/workflows/validate-drive-file-folder.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/rendered-html.test.mjs
