name: Apply P0E runtime patch v2

on:
  push:
    branches: [fix/p0e-evaluation-baseline]
    paths: [.github/workflows/apply-p0e-runtime-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0e-evaluation-baseline
          fetch-depth: 0
      - name: Apply contextual evaluation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          Path('app/page.tsx').write_text('''import CyaApp from "./cya-app";\n\nexport const dynamic = "force-dynamic";\n\nexport default function Home() {\n  return <CyaApp />;\n}\n''')

          p=Path('app/evaluation-post-class.tsx'); text=p.read_text()
          if 'export function EvaluationPostClassGate() {' not in text: raise SystemExit('post gate signature missing')
          text=text.replace('export function EvaluationPostClassGate() {','export function EvaluationPostClassGate({ classId, onCompleted }: { classId: number; onCompleted?: () => void | Promise<void> }) {',1)
          anchor='      .eq("status","finished")\n      .not("administrative_finished_at","is",null)'
          if text.count(anchor)!=1: raise SystemExit('post class query anchor missing')
          text=text.replace(anchor,'      .eq("id",classId)\n      .eq("status","finished")\n      .not("administrative_finished_at","is",null)',1)
          if text.count('  },[client,handledClassIds]);')!=1: raise SystemExit('post deps anchor missing')
          text=text.replace('  },[client,handledClassIds]);','  },[classId,client,handledClassIds]);',1)
          anchor='    setPendingClass(null);\n    setBusy("");'
          if text.count(anchor)!=1: raise SystemExit('post finish anchor missing')
          text=text.replace(anchor,'    setPendingClass(null);\n    setBusy("");\n    await onCompleted?.();',1)
          p.write_text(text)

          p=Path('app/cya-app.tsx'); text=p.read_text()
          if 'ClipboardCheck' not in text.split('} from "lucide-react";')[0]:
              text=text.replace('ChevronRight, CircleUserRound,\n  Dumbbell,','ChevronRight, CircleUserRound, ClipboardCheck,\n  Dumbbell,',1)
          imp='import { ClassSummaryContentEditor } from "./class-summary-content-editor";\n'
          if text.count(imp)!=1: raise SystemExit('cya import anchor missing')
          text=text.replace(imp,imp+'import { ContextEvaluationPanel } from "./context-evaluation-panel";\nimport { EvaluationPostClassGate } from "./evaluation-post-class";\n',1)
          old='useState<"work"|"context"|"notes">("work")'
          if text.count(old)!=1: raise SystemExit('liveTab type anchor missing')
          text=text.replace(old,'useState<"work"|"context"|"notes"|"evaluation">("work")',1)
          oldnav='<nav className="live-work-tabs"><button className={liveTab===\'work\'?\'active\':\'\'} onClick={() => setLiveTab(\'work\')}><BookOpen/> Trabajo</button><button className={liveTab===\'context\'?\'active\':\'\'} onClick={() => setLiveTab(\'context\')}><Sparkles/> Contexto</button><button className={liveTab===\'notes\'?\'active\':\'\'} onClick={() => setLiveTab(\'notes\')}><NotebookPen/> Observaciones</button></nav>'
          newnav=oldnav[:-6]+'<button className={liveTab===\'evaluation\'?\'active\':\'\'} onClick={() => setLiveTab(\'evaluation\')}><ClipboardCheck/> Evaluación</button></nav>'
          if text.count(oldnav)!=1: raise SystemExit('live nav anchor missing')
          text=text.replace(oldnav,newnav,1)
          context_anchor="      {liveTab==='context' ? <section className=\"live-context-grid\">"
          if text.count(context_anchor)!=1: raise SystemExit('live context anchor missing')
          block="      {liveTab==='evaluation' && db && participant ? <section className=\"live-evaluation-workspace\"><article className=\"card live-card\"><ContextEvaluationPanel client={db} personId={activePersonId} personName={student?.display_name || 'Alumno'} classId={item.id} styleTermId={item.style_term_id} roleTermId={participant.role_term_id} levelTermId={participant.level_term_id} onCompleted={loadLive} /></article></section> : null}\n"
          text=text.replace(context_anchor,block+context_anchor,1)
          pattern=r'function ClassPostAdministrative\(\{ item, students, no, yes \}: \{ item: ClassItem; students: Person\[\]; no: \(\) => void; yes: \(\) => void \}\) \{\n  return <div className="class-workflow-page post-admin">.*?\n\}\n\nfunction ClassFinalSummary'
          replacement='''function ClassPostAdministrative({ item, students, no, yes }: { item: ClassItem; students: Person[]; no: () => void; yes: () => void }) {\n  const [reviewOpen,setReviewOpen]=useState(false);\n  return <div className="class-workflow-page post-admin"><div className="workflow-stepbar"><span>Datos</span><span>Preparar</span><span>Dar clase</span><span className="active">Resumen</span></div><section className="card pad post-admin-card"><CheckCircle2 /><p className="eyebrow">Administración terminada</p><h1>{namesFor(item.class_participants.map((p) => p.person_id),students)}</h1><p>El saldo y el cobro ya están registrados. La evaluación general es opcional. La revisión posterior, si está pendiente, pertenece solo a esta clase.</p><div className="post-admin-actions"><button className="btn ghost" onClick={no}>No, terminaré después</button><button className="btn ghost" onClick={() => setReviewOpen(true)}><ClipboardCheck/> Revisar evaluación de esta clase</button><button className="btn" onClick={yes}>Sí, preparar resumen <ArrowRight /></button></div></section>{reviewOpen ? <EvaluationPostClassGate classId={item.id} onCompleted={() => setReviewOpen(false)} /> : null}</div>;\n}\n\nfunction ClassFinalSummary'''
          text2,count=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'ClassPostAdministrative replacement count={count}')
          p.write_text(text2)

          p=Path('app/student-detail.tsx'); text=p.read_text()
          imp='import { EvaluationRadar } from "./evaluation-radar";\n'
          if text.count(imp)!=1: raise SystemExit('student import anchor missing')
          text=text.replace(imp,imp+'import { ContextEvaluationPanel } from "./context-evaluation-panel";\n',1)
          pattern=r'(function renderEvaluation\(\) \{\n    return <div className=\{styles\.evalStack\}>\n)      <section className=\{styles\.sectionCard\}>.*?</section>\n      (<div className=\{styles\.evalGrid\}>)'
          repl=r'\1      <section className={styles.sectionCard}><ContextEvaluationPanel client={client} personId={student.id} personName={student.display_name} onCompleted={async () => { setProfileRefresh((value) => value + 1); await refresh(); }} /></section>\n      \2'
          text2,count=re.subn(pattern,repl,text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'student evaluation replacement count={count}')
          p.write_text(text2)

          for filename in ['qa/tests/release-wide-audit.spec.ts','qa/tests/mobile-touch-targets.spec.ts','qa/tests/functional-class-flow.spec.ts']:
              p=Path(filename); text=p.read_text()
              text=re.sub(r'import \{ isolateInitialEvaluationGateForUnrelatedQa \} from "\./known-audit-isolation";\n','',text)
              text=re.sub(r'\n\s*await isolateInitialEvaluationGateForUnrelatedQa\(page\);','',text)
              p.write_text(text)
          Path('qa/tests/known-audit-isolation.ts').unlink(missing_ok=True)

          p=Path('qa/tests/functional-class-flow.spec.ts'); text=p.read_text()
          text,count=re.subn(r'async function ensureQaInitialBaseline\(.*?\n}\n\nasync function completeQaPostClassEvaluation','async function completeQaPostClassEvaluation',text,count=1,flags=re.S)
          if count!=1: raise SystemExit(f'baseline helper removal count={count}')
          text=text.replace('    await ensureQaInitialBaseline(page, fixture.classId);\n','')
          text=text.replace('    // CYA-AUD-013/P0E is separately tracked. The global dialogs are hidden here, but this\n    // test still completes initial/post-class evaluation for its own QA class via the same RPCs.\n    // It never mutates unrelated real classes. P17 remains the dedicated evaluation UI gate.\n','    // P0E: the teacher works before any baseline exists; the post-class review may become the first valid evaluation.\n')
          p.write_text(text)
          PY

          git rm .github/workflows/apply-p0e-runtime.yml .github/workflows/apply-p0e-runtime-v2.yml
          git diff --check
          git add -A
          git config user.name "CYA QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "p0e: integrate contextual optional evaluation [p0e-applied]"
          git push origin HEAD:fix/p0e-evaluation-baseline
